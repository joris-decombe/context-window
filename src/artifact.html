<title>Inside the Context Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#FAF7F1; --surface:#FFFDF9; --surface-2:#F2EDE3; --surface-3:#E8E1D3;
  --ink:#1E1913; --ink-2:#554D43; --ink-3:#686055;
  --line:#E0D8C8; --line-2:#CBC1AD;
  /* section accents — max-chroma hues, each validated at Lc 60 for 13px/600 mono */
  --a1:#E70092; --a2:#3874FF; --a3:#A947FF; --a4:#0088AA; --a5:#00913D; --a6:#A77500; --a7:#E83600;
  --accent:#6A18E0; --accent-bg:#6a18e01a; --accent-ink:#FFFFFF;
  /* ordinal ramp: instruction rank, dark = most privileged */
  --r1:#3C0070; --r2:#5800A5; --r3:#7400DA; --r4:#9010FF; --r5:#A845FF; --r6:#C17AFF;
  /* validated categorical slots (budget bar) */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4;
  --good:#00913D; --bad:#E83600; --warn:#A77500;
  /* legacy aliases, now all one accent */
  --l-system:var(--accent); --l-harness:var(--accent); --l-project:var(--accent); --l-user:var(--accent); --l-world:var(--accent);
  --l-system-bg:var(--accent-bg); --l-harness-bg:var(--accent-bg); --l-project-bg:var(--accent-bg); --l-user-bg:var(--accent-bg); --l-world-bg:var(--accent-bg);
  --shadow:0 1px 2px rgba(62,48,28,.06), 0 10px 30px -18px rgba(62,48,28,.34);
  --radius:10px;
  --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --measure:64ch;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141127; --surface:#1A1637; --surface-2:#241E48; --surface-3:#2F2758;
    --ink:#ECEBF4; --ink-2:#CECCD9; --ink-3:#C5C3D0;
    --line:#332B5C; --line-2:#463C78;
    --a1:#FF93D7; --a2:#98B7FF; --a3:#D4A3FF; --a4:#00C5F6; --a5:#00D258; --a6:#F1A900; --a7:#FF9E81;
    --accent:#D19CFF; --accent-bg:#d19cff26; --accent-ink:#1A1233;
    --r1:#E7D0FB; --r2:#D1A4F8; --r3:#BB79F4; --r4:#A54EF1; --r5:#8E22ED; --r6:#7711D0;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
    --good:#00D258; --bad:#FF9E81; --warn:#F1A900;
    --shadow:0 1px 2px rgba(0,0,0,.40), 0 12px 34px -20px rgba(0,0,0,.80);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141127; --surface:#1A1637; --surface-2:#241E48; --surface-3:#2F2758;
  --ink:#ECEBF4; --ink-2:#CECCD9; --ink-3:#C5C3D0;
  --line:#332B5C; --line-2:#463C78;
  --a1:#FF93D7; --a2:#98B7FF; --a3:#D4A3FF; --a4:#00C5F6; --a5:#00D258; --a6:#F1A900; --a7:#FF9E81;
  --accent:#D19CFF; --accent-bg:#d19cff26; --accent-ink:#1A1233;
  --r1:#E7D0FB; --r2:#D1A4F8; --r3:#BB79F4; --r4:#A54EF1; --r5:#8E22ED; --r6:#7711D0;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181;
  --good:#00D258; --bad:#FF9E81; --warn:#F1A900;
  --shadow:0 1px 2px rgba(0,0,0,.40), 0 12px 34px -20px rgba(0,0,0,.80);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--body); font-size:18px; line-height:1.62;
  font-optical-sizing:auto; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); font-weight:800; line-height:1.08; text-wrap:balance; margin:0}
a{color:inherit; text-underline-offset:3px; text-decoration-thickness:1px}
:focus-visible{outline:2px solid var(--l-system); outline-offset:3px; border-radius:4px}

/* ---------- chrome ---------- */
#progress{position:fixed; top:0; left:0; right:0; height:3px; background:transparent; z-index:60; pointer-events:none}
#progress > i{display:block; height:100%; width:0%; background:linear-gradient(90deg,var(--a1),var(--a3) 22%,var(--a2) 44%,var(--a4) 62%,var(--a5) 80%,var(--a6)); transition:width .08s linear}
header#bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  display:flex; align-items:center; gap:.6rem;
  padding:.55rem clamp(16px,4vw,40px);
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
#bar .brand{font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#bar .spacer{flex:1}
.ctl{
  font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  background:var(--surface); color:var(--ink-2);
  border:1px solid var(--line-2); border-radius:999px;
  padding:.34rem .6rem; cursor:pointer; display:inline-flex; align-items:center; gap:.35rem;
}
.ctl:hover{color:var(--ink); border-color:var(--ink-3)}
.segmented{display:inline-flex; border:1px solid var(--line-2); border-radius:999px; overflow:hidden; background:var(--surface)}
.segmented button{
  font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
  background:transparent; color:var(--ink-3); border:0; padding:.38rem .62rem; cursor:pointer;
}
.segmented button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}

/* ---------- layout ---------- */
.wrap{max-width:1180px; margin:0 auto; padding-inline:clamp(16px,4vw,40px)}
.col{max-width:var(--measure); margin-inline:auto}
main{padding-bottom:6rem}
p{margin:0 0 1.05em}
.lead{font-size:1.16em; color:var(--ink-2)}

/* ---------- hero ---------- */
#hero{padding-block:clamp(2.4rem,7vw,5rem) clamp(2rem,5vw,3.4rem); border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 1rem}
#hero h1{font-size:clamp(2.5rem,7.2vw,4.6rem); letter-spacing:-.025em}
#hero h1 em{font-style:normal; color:var(--a3);
  background:linear-gradient(100deg,var(--a3) 0%,var(--a1) 55%,var(--a7) 100%);
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
@supports not (background-clip:text){ #hero h1 em{-webkit-text-fill-color:currentColor} }
#hero .lead{margin-top:1.4rem; font-size:clamp(1.06rem,2.4vw,1.32rem); max-width:56ch}
.hero-meta{display:flex; flex-wrap:wrap; gap:.5rem; margin-top:1.8rem}
.tagpill{font-family:var(--mono); font-size:12px; letter-spacing:.04em; border:1px solid var(--line-2); border-radius:999px;
  padding:.3rem .7rem .3rem .55rem; color:var(--ink-2); background:var(--surface); display:inline-flex; align-items:center; gap:.42rem}
.tagpill i{width:8px; height:8px; border-radius:50%; background:var(--tc,var(--accent)); display:block; flex:none}

/* ---------- toc ---------- */
#toc{padding-block:2.2rem; border-bottom:1px solid var(--line)}
#toc ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:.15rem}
#toc a{display:flex; gap:.7rem; align-items:baseline; padding:.5rem .6rem; border-radius:8px; text-decoration:none; color:var(--ink-2)}
#toc a:hover{background:var(--surface-2); color:var(--ink)}
#toc .n{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--tn,var(--ink-3))}
#toc .t{font-family:var(--display); font-weight:600; font-size:.94rem; line-height:1.25}

/* ---------- sections ---------- */
section.sec{padding-block:clamp(3rem,8vw,5.5rem); border-bottom:1px solid var(--line); scroll-margin-top:5rem}
.sec-head{display:flex; gap:1rem; align-items:flex-start; margin-bottom:1.6rem}
.sec-num{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--accent); padding-top:.55rem; letter-spacing:.08em}
.sec-head h2{font-size:clamp(1.85rem,4.6vw,2.9rem); letter-spacing:-.02em; flex:1}
.sec-dek{font-family:var(--display); font-weight:400; font-size:clamp(1.02rem,2.2vw,1.2rem); color:var(--ink-2); margin:.85rem 0 0; line-height:1.4}
.share{flex:none; margin-top:.5rem; opacity:.55}
.share:hover{opacity:1}

/* ---------- prose extras ---------- */
.callout{
  border-left:4px solid var(--accent); background:var(--surface);
  padding:1rem 1.15rem; border-radius:0 var(--radius) var(--radius) 0; margin:1.8rem 0;
  box-shadow:var(--shadow);
}
.callout .lbl{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:.45rem}
.callout p:last-child{margin-bottom:0}
.callout p{font-size:.97em}

details.dive{
  border:1px solid var(--line); border-radius:var(--radius); background:var(--surface);
  margin:1.4rem 0; overflow:hidden;
}
details.dive > summary{
  cursor:pointer; list-style:none; padding:.85rem 1.1rem;
  font-family:var(--mono); font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2);
  display:flex; gap:.6rem; align-items:center;
}
details.dive > summary::-webkit-details-marker{display:none}
details.dive > summary::before{
  content:"+"; font-size:15px; font-weight:700; color:var(--accent); width:1em; flex:none; text-align:center;
}
details.dive[open] > summary::before{content:"\2212"}
details.dive > summary:hover{color:var(--ink); background:var(--surface-2)}
.dive-body{padding:0 1.1rem 1.1rem; font-size:.95em; color:var(--ink-2); border-top:1px solid var(--line)}
.dive-body > *:first-child{margin-top:1rem}
.dive-body p:last-child{margin-bottom:0}
.dive-body strong{color:var(--ink)}

ul.bul{margin:0 0 1.2em; padding-left:1.15em}
ul.bul li{margin-bottom:.5em}
code, .k{font-family:var(--mono); font-size:.85em; background:var(--surface-2); padding:.12em .38em; border-radius:4px; color:var(--ink)}

/* ---------- figures & scenes ---------- */
figure{margin:2.4rem 0; }
figcaption{font-family:var(--mono); font-size:12px; line-height:1.5; color:var(--ink-3); margin-top:.8rem; letter-spacing:.02em}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(1rem,3vw,1.6rem); box-shadow:var(--shadow)}

.scene{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:clamp(1.2rem,4vw,3rem); align-items:start; margin:2.5rem 0}
.scene-sticky{position:sticky; top:calc(env(safe-area-inset-top,0px) + 4.6rem); z-index:1}
.scene-steps{display:flex; flex-direction:column; gap:0}
.step{padding-block:clamp(2.5rem,16vh,7rem); opacity:.45; transition:opacity .4s ease}
.step:first-child{padding-top:1rem}
.step.on{opacity:1}
.step h4{font-family:var(--display); font-size:1.1rem; font-weight:600; margin-bottom:.5rem; display:flex; gap:.55rem; align-items:baseline}
.step h4 .dot{width:10px; height:10px; border-radius:50%; background:var(--line-2); flex:none;
  transform:translateY(-1px); transition:background .35s ease, transform .35s ease, box-shadow .35s ease}
.step.on h4 .dot{background:var(--accent); transform:translateY(-1px) scale(1.3); box-shadow:0 0 0 4px var(--accent-bg)}
.step p{font-size:.97em; color:var(--ink-2); margin:0}
@media (max-width:860px){
  .scene{grid-template-columns:1fr; gap:0}
  .scene-sticky{top:calc(env(safe-area-inset-top,0px) + 3.3rem); background:var(--bg); padding-block:.7rem .4rem; margin-inline:-4px; padding-inline:4px}
  .step{padding-block:clamp(2rem,12vh,4rem)}
  .scene-sticky .panel{padding:.75rem}
  .scene-sticky figcaption{display:none}
  .scene-sticky .layer{padding:.4rem .55rem}
  .scene-sticky .layer .ex{font-size:.8rem; line-height:1.3}
  .scene-sticky .layer .nm{font-size:11px}
  .scene-sticky .budget{height:34px}
  .scene-sticky .legend div{font-size:10.5px}
  .step, .step.on{opacity:1}
  .step h4{color:var(--ink-3); transition:color .35s ease}
  .step.on h4{color:var(--ink)}
  .step{padding-block:2.6rem}
  .step:first-child{padding-top:.8rem}
}
@media (max-width:430px){
  .scene-sticky .stack{gap:4px}
  .scene-sticky .layer{padding:.34rem .5rem}
  .scene-sticky .layer .who{display:none}
  .scene-sticky .layer .ex{font-size:.78rem}
  #bar .brand{font-size:11px}
}
/* comfortable touch targets on phones and tablets */
@media (pointer:coarse){
  header#bar{padding-block:.2rem}
  #sources a{display:inline-block; padding-block:.35rem}
  .ctl{min-height:44px; padding-inline:.85rem}
  .segmented button{min-height:44px; min-width:48px}
  .tabs button{min-height:44px; padding-inline:.95rem}
  .share{width:44px; height:44px; justify-content:center; padding:0}
  #toc a{padding-block:.72rem}
  details.dive > summary{padding-block:1rem}
  .play > summary{padding-block:1.05rem}
}

/* tokens scene */
.tokfield{width:100%; min-height:88px; resize:vertical; font-family:var(--body); font-size:1rem; line-height:1.5;
  background:var(--surface-2); color:var(--ink); border:1px solid var(--line-2); border-radius:8px; padding:.7rem .8rem}
.tokrow{display:flex; flex-wrap:wrap; gap:3px; margin-top:.9rem; min-height:40px}
.tok{font-family:var(--mono); font-size:12.5px; line-height:1.5; padding:.16rem .3rem; border-radius:4px; white-space:pre; border:1px solid transparent}
.tokstats{display:flex; flex-wrap:wrap; gap:1.2rem; margin-top:1rem; padding-top:.9rem; border-top:1px dashed var(--line-2)}
.stat{display:flex; flex-direction:column}
.stat .v{font-family:var(--mono); font-size:1.4rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3)}

/* cache calculator */
.calcrow{display:flex; flex-wrap:wrap; gap:.9rem; margin-bottom:1.1rem}
.calcfield{flex:1 1 150px; display:flex; flex-direction:column; gap:.3rem}
.calcfield label{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3)}
.calcfield input{font-family:var(--mono); font-size:1rem; background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line-2); border-radius:8px; padding:.5rem .6rem; width:100%; min-width:0}
.calcout{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.6rem}
.calcout > div{background:var(--surface-2); border-radius:8px; padding:.7rem .8rem; border-left:3px solid var(--cc,var(--line-2))}
.calcout .v{font-family:var(--mono); font-size:1.35rem; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; display:block}
.calcout .l{font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); display:block; margin-top:.15rem}
.calcnote{font-family:var(--mono); font-size:11px; line-height:1.5; color:var(--ink-3); margin-top:.9rem; padding-top:.8rem; border-top:1px dashed var(--line-2)}
.cachebar{display:flex; height:34px; border-radius:8px; overflow:hidden; border:1px solid var(--line-2); margin-bottom:.55rem}
.cachebar span{display:block; height:100%; display:flex; align-items:center; justify-content:center;
  font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.06em; white-space:nowrap; overflow:hidden}

/* budget bar */
.budget{display:flex; height:46px; width:100%; border-radius:8px; overflow:hidden; border:1px solid var(--line-2); background:var(--surface-2)}
.budget > span{display:block; height:100%; width:0; transition:width .6s cubic-bezier(.22,1,.36,1)}
.legend{display:flex; flex-direction:column; gap:.4rem; margin-top:1rem}
.legend div{display:flex; align-items:center; gap:.55rem; font-family:var(--mono); font-size:12px; color:var(--ink-2); opacity:.55; transition:opacity .4s}
.legend div.on{opacity:1}
.legend .sw{width:11px; height:11px; border-radius:3px; flex:none}
.legend .amt{margin-left:auto; color:var(--ink-3); font-variant-numeric:tabular-nums}

/* layer stack */
.stack{display:flex; flex-direction:column; gap:6px}
.layer{
  border:1px solid var(--line-2); border-left:6px solid var(--lc,var(--ink-3)); border-radius:7px;
  background:var(--surface); padding:.6rem .75rem; opacity:.4; transform:translateX(-10px);
  transition:opacity .45s ease, transform .45s cubic-bezier(.22,1,.36,1);
}
.layer.on{opacity:1; transform:none}
.layer .nm{font-family:var(--mono); font-size:12px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--ink)}
.layer .ex{font-family:var(--body); font-size:.92rem; color:var(--ink-2); margin-top:.15rem; line-height:1.4}
.layer .who{font-family:var(--mono); font-size:11px; color:var(--ink-3); float:right}

/* loop diagram */
.loopwrap{position:relative}
.loopwrap svg{width:100%; height:auto; display:block; overflow:visible}
.loopwrap text{font-family:var(--mono)}
.nodeg text{font-size:11px}
.nodeg rect{transition:fill .35s ease, stroke .35s ease}

/* memory tabs */
.tabs{display:flex; gap:.35rem; flex-wrap:wrap; margin-bottom:1rem}
.tabs button{font-family:var(--mono); font-size:12px; letter-spacing:.04em; padding:.4rem .7rem; border-radius:999px;
  border:1px solid var(--line-2); background:transparent; color:var(--ink-3); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:700}
.tabpane h4{font-family:var(--display); font-size:1.05rem; margin-bottom:.45rem}
.tabpane p{font-size:.95rem; color:var(--ink-2)}
.tabpane dl{display:grid; grid-template-columns:auto 1fr; gap:.45rem .9rem; margin:.9rem 0 0; font-size:.9rem}
.tabpane dt{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding-top:.25em}
.tabpane dd{margin:0; color:var(--ink-2)}

/* comparison matrix */
.matrix-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain}
table.matrix{border-collapse:collapse; width:100%; min-width:840px; font-size:.88rem; font-family:var(--body)}
table.matrix th, table.matrix td{text-align:left; vertical-align:top; padding:.7rem .8rem; border-bottom:1px solid var(--line)}
table.matrix thead th{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line-2); position:sticky; top:0; background:var(--surface)}
table.matrix tbody th{font-family:var(--mono); font-size:12px; font-weight:500; color:var(--ink-2); white-space:nowrap}
table.matrix td{color:var(--ink-2)}
table.matrix tr:hover td{background:var(--surface-2)}
.mcards{display:none}
.mcard{border:1px solid var(--line); border-top:3px solid var(--cc,var(--accent)); border-radius:var(--radius); background:var(--surface); padding:.9rem 1rem; box-shadow:var(--shadow)}
.mcard h4{font-family:var(--display); font-size:1.05rem; margin-bottom:.7rem}
.mcard dl{display:grid; grid-template-columns:minmax(6.5rem,auto) 1fr; gap:.45rem .9rem; margin:0}
.mcard dt{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--ink-3); padding-top:.3em; overflow-wrap:anywhere}
.mcard dd{margin:0; font-size:.93rem; color:var(--ink-2); line-height:1.45}
@media (max-width:720px){
  .matrix-scroll{display:none}
  .mcards{display:grid; gap:.75rem}
}

/* surface cards */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.9rem; margin:1.8rem 0}
.card{border:1px solid var(--line); border-top:3px solid var(--cc,var(--ink-3)); border-radius:var(--radius); background:var(--surface); padding:1.05rem; box-shadow:var(--shadow)}
.card h4{font-family:var(--display); font-size:1.02rem; margin-bottom:.15rem}
.card .sub{font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--cc,var(--accent)); margin-bottom:.6rem}

/* playbooks */
.play{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); margin:.7rem 0; overflow:hidden}
.play > summary{cursor:pointer; list-style:none; padding:.95rem 1.1rem; display:flex; align-items:center; gap:.8rem}
.play > summary::-webkit-details-marker{display:none}
.play .pn{font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.1em; color:var(--ink-3); flex:none}
.play .pt{font-family:var(--display); font-weight:600; font-size:1.02rem; flex:1}
.play .chev{font-family:var(--mono); color:var(--ink-3); font-size:13px}
.play[open] .chev{transform:rotate(90deg)}
.play .chev{display:inline-block; transition:transform .2s}
.play-body{padding:0 1.1rem 1.1rem; border-top:1px solid var(--line); font-size:.94rem; color:var(--ink-2)}
.play-body > *:first-child{margin-top:.95rem}
.play-body ol{padding-left:1.2em; margin:0 0 1em}
.play-body li{margin-bottom:.45em}
.play-body .row{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.8rem; margin-top:.4rem}
.play-body .row > div{background:var(--surface-2); border-radius:8px; padding:.7rem .8rem}
.play-body .row h5{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin:0 0 .35rem; color:var(--accent)}
.play-body .row p{margin:0; font-size:.88rem}

/* prompt compare */
.pc{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:.8rem; margin:1.4rem 0}
.pc > div{border:1px solid var(--line); border-radius:var(--radius); padding:.85rem .95rem; background:var(--surface)}
.pc .h{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; margin-bottom:.5rem}
.pc .bad .h, .pc .good .h{color:var(--ink-2)}
.pc .bad{border-left:3px solid var(--bad)} .pc .good{border-left:3px solid var(--good)}
.pc p{font-family:var(--mono); font-size:.78rem; line-height:1.55; color:var(--ink-2); margin:0; white-space:pre-wrap}

/* sources */
#sources ol{padding-left:1.3em; font-size:.9rem; color:var(--ink-2)}
#sources li{margin-bottom:.5em}
#sources a{color:var(--ink); text-decoration-color:var(--accent); text-decoration-thickness:2px}

footer{padding-block:2.5rem; color:var(--ink-3); font-family:var(--mono); font-size:11px; line-height:1.7}

/* toast */
#toast{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem); transform:translate(-50%,240%); opacity:0; pointer-events:none; visibility:hidden;
  background:var(--ink); color:var(--bg); font-family:var(--mono); font-size:11.5px; padding:.6rem .95rem; border-radius:999px;
  z-index:80; transition:transform .3s cubic-bezier(.22,1,.36,1); max-width:min(92vw,520px); text-align:center; overflow-wrap:anywhere}
#toast{transition:transform .3s cubic-bezier(.22,1,.36,1), opacity .25s ease, visibility 0s linear .3s}
#toast.on{transform:translate(-50%,0); opacity:1; visibility:visible; transition:transform .3s cubic-bezier(.22,1,.36,1), opacity .2s ease, visibility 0s}

/* reveal */
.js .rv{opacity:0; transform:translateY(14px)}
.js .rv.in{opacity:1; transform:none; transition:opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1)}
@media (prefers-reduced-motion: reduce){
  .js .rv, .js .rv.in{opacity:1 !important; transform:none !important; transition:none !important}
  .step{opacity:1 !important}
  .layer{opacity:1 !important; transform:none !important}
  *{scroll-behavior:auto !important}
}

/* ─────────────────────────── 01 TOKENS ─────────────────────────── */
{
 id:"tokens", num:"01", scene:"tokens", color:"var(--a1)",
 en:{
  title:"Tokens",
  dek:"The model does not read words. It reads fragments, and it counts every one of them.",
  body:[
   `Before your message reaches the model, it is chopped into <b>tokens</b>: fragments of roughly four characters. Ordinary words are one token. Unusual words, names, accents and punctuation take several. The model then produces its answer one fragment at a time, which is why you see it typing rather than replying all at once.`,
   `This matters because the token is the unit of everything you will bump into. Your monthly limit is really a token budget. So is the amount of a document the assistant can hold at once. When a long conversation starts feeling slower, or you hit a cap sooner than you expected, the explanation is almost always counting rather than anything mysterious.`,
   `One fact worth knowing if you work in French: <b>the same text costs more in French than in English</b>, usually by 15 to 25%, because these systems were built mainly on English and accented letters get split apart. A long French conversation uses up a limit faster than the same conversation in English. It is not a reason to switch languages; it is a reason to know why the numbers move.`
  ],
  figCaption:"Type anything and watch it come apart. The split below approximates how a real tokenizer works: close enough to build intuition, not close enough to bill against. Try the same sentence in French and in English.",
  demoLabel:"Your text",
  demoDefault:"Summarise this letter from the school and tell me what I actually need to reply to.",
  stats:{chars:"Characters",tokens:"Tokens approx.",ratio:"Chars / token",cost:"Cost, Claude Opus 5"},
  dives:[
   {t:"Why the split looks so strange",
    html:`<p>These systems learn their fragments from data rather than from grammar. The method starts with raw bytes and repeatedly glues together whichever pair appears most often, until it has a fixed vocabulary of 100,000&ndash;200,000 pieces. Nobody chose them by hand, which is why the boundaries land in odd places.</p>
    <p>A few consequences you can see in the demo above:</p>
    <ul class="bul">
      <li>The space belongs to the word that follows it, so the same word costs differently at the start of a sentence.</li>
      <li>Numbers are often broken up digit by digit, which is part of why these systems are better at prose than at arithmetic.</li>
      <li>Common words survive whole; rare ones, proper nouns and anything accented get shattered.</li>
      <li>Each company uses a different vocabulary, so a count from one is not a count from another.</li>
    </ul>`},
   {t:"What it costs, and why your limit moves",
    html:`<p>If you pay a monthly subscription you never see a token price, but the limit behind your plan is counted this way, and the cost is what sets it. Published prices per million tokens, in and out:</p>
    <ul class="bul">
      <li><b>Claude Opus 5</b>: $5 / $25 &nbsp;·&nbsp; <b>Sonnet 5</b>: $2 / $10 &nbsp;·&nbsp; <b>Haiku 4.5</b>: $1 / $5</li>
      <li><b>Gemini 3.1 Pro</b>: $2 / $12, rising to $4 / $18 once a conversation passes 200,000 tokens. <b>Gemini 3.7 Flash</b>: $0.75 / $3.75. <b>Gemini 3.8 Flash</b> is the current everyday model.</li>
    </ul>
    <p>Two things about this are worth carrying around. The smaller, cheaper models are perfectly good for most ordinary requests, and they are five to ten times cheaper, so if you keep running out, using the biggest model for everything is usually the reason. And on Gemini, the price literally steps up once a conversation gets long, which is the clearest possible argument for the advice in the next section.</p>`}
  ],
  callout:`<b>Say it once, clearly.</b> Repeating an instruction three different ways does not make it three times more likely to be followed. It fills the budget and muddies the signal. One clear sentence beats three hopeful ones.`
 },
 fr:{
  title:"Les tokens",
  dek:"Le modèle ne lit pas des mots. Il lit des fragments, et il les compte tous.",
  body:[
   `Avant que votre message n’arrive au modèle, il est découpé en <b>tokens</b> : des fragments d’environ quatre caractères. Les mots courants font un token. Les mots rares, les noms propres, les accents et la ponctuation en font plusieurs. Le modèle produit ensuite sa réponse fragment par fragment, d’où l’impression qu’il tape au lieu de répondre d’un coup.`,
   `C’est important parce que le token est l’unité de tout ce sur quoi vous allez buter. Votre limite mensuelle est en réalité un budget de tokens. La quantité de document que l’assistant peut tenir en tête aussi. Quand une longue conversation devient poussive, ou qu’une limite arrive plus tôt que prévu, l’explication relève presque toujours du calcul, pas du mystère.`,
   `Un fait à connaître quand on travaille en français : <b>le même texte coûte plus cher en français qu’en anglais</b>, de 15 à 25&nbsp;% en plus en général, parce que ces systèmes ont été construits surtout sur de l’anglais et que les lettres accentuées sont découpées. Une longue conversation en français épuise donc un quota plus vite que la même en anglais. Ce n’est pas une raison de changer de langue, c’est une raison de comprendre pourquoi les chiffres bougent.`
  ],
  figCaption:"Tapez ce que vous voulez et regardez le texte se défaire. Le découpage ci-dessous approxime le fonctionnement réel : assez juste pour l’intuition, pas pour la facturation. Essayez la même phrase en français puis en anglais.",
  demoLabel:"Votre texte",
  demoDefault:"Résume cette lettre de l’école et dis-moi à quoi je dois vraiment répondre.",
  stats:{chars:"Caractères",tokens:"Tokens approx.",ratio:"Caractères / token",cost:"Coût, Claude Opus 5"},
  dives:[
   {t:"Pourquoi le découpage paraît si bizarre",
    html:`<p>Ces systèmes apprennent leurs fragments à partir de données, pas de grammaire. La méthode part des octets bruts et recolle sans cesse la paire la plus fréquente, jusqu’à obtenir un vocabulaire figé de 100&nbsp;000 à 200&nbsp;000 morceaux. Personne ne les a choisis à la main : c’est pourquoi les frontières tombent à des endroits étranges.</p>
    <p>Quelques conséquences visibles dans la démo ci-dessus :</p>
    <ul class="bul">
      <li>L’espace appartient au mot qui le suit : le même mot ne coûte pas pareil en début de phrase.</li>
      <li>Les nombres sont souvent découpés chiffre par chiffre, ce qui explique en partie pourquoi ces systèmes sont meilleurs en prose qu’en calcul.</li>
      <li>Les mots courants survivent entiers ; les mots rares, les noms propres et tout ce qui porte un accent éclatent.</li>
      <li>Chaque éditeur a son propre vocabulaire : un décompte chez l’un ne vaut pas chez l’autre.</li>
    </ul>`},
   {t:"Ce que ça coûte, et pourquoi votre quota bouge",
    html:`<p>Avec un abonnement mensuel, vous ne voyez jamais un prix au token, mais la limite derrière votre formule se compte ainsi, et c’est le coût qui la fixe. Tarifs publics par million de tokens, entrée / sortie :</p>
    <ul class="bul">
      <li><b>Claude Opus 5</b>&nbsp;: 5 / 25&nbsp;$ &nbsp;·&nbsp; <b>Sonnet 5</b>&nbsp;: 2 / 10&nbsp;$ &nbsp;·&nbsp; <b>Haiku 4.5</b>&nbsp;: 1 / 5&nbsp;$</li>
      <li><b>Gemini 3.1 Pro</b>&nbsp;: 2 / 12&nbsp;$, puis 4 / 18&nbsp;$ dès qu’une conversation dépasse 200&nbsp;000 tokens. <b>Gemini 3.7 Flash</b>&nbsp;: 0,75 / 3,75&nbsp;$. <b>Gemini 3.8 Flash</b> est le modèle courant du moment.</li>
    </ul>
    <p>Deux choses à retenir. Les modèles plus petits et moins chers suffisent très bien pour la plupart des demandes ordinaires, et ils coûtent cinq à dix fois moins : si vous êtes souvent à court, utiliser le plus gros modèle pour tout en est généralement la cause. Et chez Gemini, le prix monte littéralement d’un cran quand la conversation s’allonge. C’est le meilleur argument possible en faveur de la section suivante.</p>`}
  ],
  callout:`<b>Dites-le une fois, clairement.</b> Répéter une consigne de trois façons ne la rend pas trois fois mieux suivie. Cela remplit le budget et brouille le signal. Une phrase claire vaut mieux que trois formulations pleines d’espoir.`
 }

/* ─────────────────────── 02 CONTEXT WINDOW ─────────────────────── */
{
 id:"context", num:"02", scene:"budget", color:"var(--a2)",
 en:{
  title:"The context window",
  dek:"Nothing is remembered between messages. The whole conversation is simply sent again, every time.",
  body:[
   `This is the single most useful thing to understand, and almost nobody is told it. The model has no memory of your last message. Every time you press send, the app quietly rebuilds the entire conversation: the instructions it was given, everything you have both said, every document you attached. Then it sends the whole thing as one block. That block is the <b>context window</b>.`,
   `So a conversation does not accumulate understanding. It accumulates <em>text</em>, which is re-sent and re-read from scratch at every turn. The twentieth message in a thread is not twenty messages of wisdom; it is one very long message.`,
   `These blocks can now be enormous: around a million tokens, several novels' worth. Which makes it tempting to paste everything in and let the machine sort it out. That turns out to be a bad instinct. Researchers at Chroma tested eighteen different models on tasks that stayed easy no matter how much text surrounded them, and every single model got worse as the text grew. A single irrelevant paragraph measurably hurt. Models even did <em>better</em> when the surrounding text was shuffled nonsense than when it was coherent and on-topic.`,
   `The practical version: a focused conversation gets better answers than a long one. When the subject changes, start a new one.`
  ],
  steps:[
   {h:"The instructions it was given",p:"Written by the company and by whoever set up the app. It tells the assistant how to behave, what it may do, and which tools exist. You never see it, but it is sent every single time."},
   {h:"What you set up once",p:"A project's instructions, a saved profile, a Gem's configuration. Loaded on every message, which is what makes it powerful and why it should stay short."},
   {h:"Documents and search results",p:"Files you attached, pages it looked up, things it pulled from your drive. The part you control most directly, and the part that quietly balloons when a search returns more than you expected."},
   {h:"Everything already said",p:"Every message from both of you, from the top. This is the part that grows without anyone deciding it should, and it is usually the largest."},
   {h:"What you just typed",p:"Almost always the smallest piece of the whole thing. And the only piece most people ever think about."}
  ],
  figCaption:"A long conversation, roughly to scale. The bar is everything being sent; your actual question is the sliver on the right.",
  dives:[
   {t:"Why a fresh conversation is usually the fix",
    html:`<p>When an assistant starts contradicting itself, forgetting your instructions, or answering a question you asked four messages ago, the cause is nearly always the same: the conversation has grown long enough that your instruction is a small voice in a large room.</p>
    <p>Starting again feels wasteful. It is the opposite. A new conversation with three sentences of context is cheaper, faster and more accurate than a two-hour thread. The trick is to make restarting cheap: before you close the old one, ask it to write a short summary of what has been decided, and paste that into the new one.</p>
    <p>This is also the honest answer to &ldquo;can I just keep one big chat for my project?&rdquo; You can, and it will slowly get worse. Use a project or a saved instruction for the things that should persist, and let individual conversations stay short and disposable.</p>`},
   {t:"How the apps fight back against this",
    html:`<p>You are not the only one managing the budget. Behind the scenes, three techniques do it for you, and it helps to recognise them.</p>
    <p><b>Summarising as it goes.</b> Near the limit, the app quietly replaces the older part of the conversation with a summary of it. This is why a very long thread sometimes forgets a detail but remembers the decisions.</p>
    <p><b>Fetching only when needed.</b> Rather than loading your whole drive, the assistant holds the names of things and opens them at the moment it needs them. An assistant with real access to your files usually beats one handed a giant paste.</p>
    <p><b>Sending a helper.</b> For a task that involves reading a lot and reporting a little, the assistant can dispatch a separate copy of itself that reads forty pages in its own private conversation and comes back with one paragraph. You pay for the paragraph.</p>`}
  ],
  callout:`<b>Start new conversations more often than feels natural.</b> A long thread is not stored knowledge. It is a bill that grows while the quality drops. When the topic turns, open a fresh one and bring across the three things that still matter.`
 },
 fr:{
  title:"La fenêtre de contexte",
  dek:"Rien n’est retenu entre deux messages. Toute la conversation est simplement renvoyée, à chaque fois.",
  body:[
   `C’est la chose la plus utile à comprendre, et presque personne ne la dit. Le modèle n’a aucun souvenir de votre message précédent. À chaque envoi, l’application reconstruit discrètement toute la conversation : les instructions qu’on lui a données, tout ce que vous vous êtes dit, chaque document joint. Puis elle envoie le tout en un bloc. Ce bloc, c’est la <b>fenêtre de contexte</b>.`,
   `Une conversation n’accumule donc pas de la compréhension. Elle accumule du <em>texte</em>, renvoyé et relu de zéro à chaque tour. Le vingtième message d’un fil, ce n’est pas vingt messages de sagesse : c’est un très long message.`,
   `Ces blocs peuvent désormais être énormes : de l’ordre du million de tokens, l’équivalent de plusieurs romans. D’où la tentation de tout coller dedans et de laisser la machine trier. Mauvais instinct. Des chercheurs de Chroma ont soumis dix-huit modèles à des tâches qui restaient faciles quelle que soit la quantité de texte autour : tous se sont dégradés à mesure que le texte grossissait. Un seul paragraphe hors sujet nuit déjà de façon mesurable. Les modèles s’en sortaient même <em>mieux</em> quand le texte environnant était un fatras mélangé que quand il était cohérent et dans le sujet.`,
   `Version pratique : une conversation ciblée obtient de meilleures réponses qu’une longue. Quand le sujet change, ouvrez-en une nouvelle.`
  ],
  steps:[
   {h:"Les instructions qu’on lui a données",p:"Rédigées par l’éditeur et par celui qui a configuré l’application. Elles disent comment se comporter, ce qui est permis, quels outils existent. Vous ne les voyez jamais, mais elles sont envoyées à chaque fois."},
   {h:"Ce que vous avez réglé une fois",p:"Les instructions d’un projet, un profil enregistré, la configuration d’un Gem. Chargées à chaque message, ce qui fait leur force, et pourquoi elles doivent rester courtes."},
   {h:"Documents et résultats de recherche",p:"Les fichiers joints, les pages consultées, ce qui a été tiré de votre drive. La part que vous contrôlez le plus directement, et celle qui enfle discrètement quand une recherche ramène plus que prévu."},
   {h:"Tout ce qui a déjà été dit",p:"Chaque message, des deux côtés, depuis le début. C’est la part qui grossit sans que personne ne l’ait décidé, et c’est généralement la plus grosse."},
   {h:"Ce que vous venez de taper",p:"Presque toujours la plus petite part de l’ensemble. Et la seule à laquelle on pense."}
  ],
  figCaption:"Une longue conversation, à peu près à l’échelle. La barre représente tout ce qui est envoyé ; votre question, c’est le copeau de droite.",
  dives:[
   {t:"Pourquoi repartir de zéro est souvent la solution",
    html:`<p>Quand un assistant se contredit, oublie vos consignes ou répond à une question posée quatre messages plus tôt, la cause est presque toujours la même : la conversation a suffisamment grossi pour que votre instruction ne soit plus qu’une petite voix dans une grande salle.</p>
    <p>Recommencer donne l’impression de gâcher. C’est l’inverse. Une conversation neuve avec trois phrases de contexte est moins chère, plus rapide et plus juste qu’un fil de deux heures. L’astuce est de rendre le redémarrage facile : avant de fermer l’ancienne, demandez-lui un court résumé de ce qui a été décidé, et collez-le dans la nouvelle.</p>
    <p>C’est aussi la réponse honnête à &laquo;&nbsp;est-ce que je peux garder une seule grande conversation pour mon projet&nbsp;?&nbsp;&raquo; Vous pouvez, et elle se dégradera lentement. Mettez dans un projet ou une instruction permanente ce qui doit durer, et laissez les conversations rester courtes et jetables.</p>`},
   {t:"Comment les applications compensent",
    html:`<p>Vous n’êtes pas seul à gérer ce budget. En coulisses, trois techniques s’en chargent, et il est utile de les reconnaître.</p>
    <p><b>Résumer au fil de l’eau.</b> Près de la limite, l’application remplace discrètement la partie ancienne de la conversation par un résumé. D’où ces longs fils qui oublient un détail mais se souviennent des décisions.</p>
    <p><b>N’aller chercher qu’au besoin.</b> Plutôt que de charger tout votre drive, l’assistant garde les noms des choses et les ouvre au moment où il en a besoin. Un assistant qui a vraiment accès à vos fichiers vaut mieux qu’un assistant à qui l’on a collé un énorme pavé.</p>
    <p><b>Envoyer un assistant de l’assistant.</b> Pour une tâche qui demande de lire beaucoup et de rapporter peu, il peut déléguer à une copie de lui-même qui lit quarante pages dans sa propre conversation privée et revient avec un paragraphe. Vous payez le paragraphe.</p>`}
  ],
  callout:`<b>Ouvrez de nouvelles conversations plus souvent que l’instinct ne le suggère.</b> Un long fil n’est pas une connaissance stockée. C’est une facture qui grossit pendant que la qualité baisse. Quand le sujet change, ouvrez-en une neuve et reprenez les trois choses qui comptent encore.`
 }
},
/* ─────────────────────── 03 CACHING ─────────────────────── */
{
 id:"caching", num:"03", scene:"cache", color:"var(--a4)",
 en:{
  title:"Caching",
  dek:"Advanced, and the one section you can skip. Re-sending the whole conversation every turn would be ruinous, so most of it is not really re-read.",
  body:[
   `The previous section leaves an obvious question. If the entire conversation is rebuilt and sent on every single message, and you pay for every token of it, why does a long conversation not cost a fortune?`,
   `Because the model does not redo all the work. The opening stretch of the prompt, the part that was identical last time, is kept in a processed form and reused. That stored state is a <b>cache</b>, and it is the reason long conversations remain affordable at all.`,
   `The important detail is <em>which</em> part gets reused. It is always a <b>prefix</b>: an unbroken run from the very beginning of the prompt up to the first thing that changed. Not "the parts that stayed the same", but "everything before the first difference". Change one word near the top and everything after it has to be processed again from scratch, however unchanged it was.`,
   `The prices tell you how much this matters. On the Claude API, storing a prefix costs 1.25 times the normal input rate, and reading it back costs one tenth. So the first message of a session is slightly more expensive than it looks, and every message after it is dramatically cheaper. You break even on the second message.`,
   `And there is a second effect, which for most people matters more than the money: on the Claude API, <b>cached tokens do not count toward your rate limit at all</b>. Only fresh ones do. Two people sending the same hundred-thousand-token document to the same model can burn through very different amounts of their allowance, purely depending on whether the stable part of their prompt stayed stable.`
  ],
  figCaption:"Asking questions about one document, priced at Claude Opus 5 rates. Change the numbers. The saving comes entirely from the document being identical each time.",
  calc:{docLabel:"Document size, tokens", turnsLabel:"Questions asked",
        noCache:"Without caching", withCache:"With caching", saving:"Saved",
        note:"First message writes the cache at 1.25x the input rate. Every message after reads it at 0.1x. History and answers are left out, so the real difference is a little smaller."},
  dives:[
   {t:"What breaks a cache, and in what order",
    html:`<p>A prompt is assembled in a fixed order: <b>tool definitions, then standing instructions, then the conversation</b>. The cache follows that order, and a change at any level invalidates that level and everything below it.</p>
    <ul class="bul">
      <li>Turning a tool or a connector on or off changes the tool definitions, which sit first. Everything after them is invalidated, which is the whole prompt.</li>
      <li>Editing your project instructions invalidates the instructions and the conversation, but not the tools.</li>
      <li>Sending a new message invalidates nothing. This is the case you want, and it is why an uninterrupted conversation is so much cheaper than a stop-start one.</li>
      <li>Switching model mid-task throws away everything. A cache belongs to one model.</li>
      <li>Attaching an image, or turning thinking on, can invalidate earlier levels too.</li>
    </ul>
    <p>Two more mechanics worth knowing. The default lifetime is <b>five minutes</b>, refreshed every time the cache is used, so an active conversation keeps itself warm and an abandoned one goes cold. An hour-long version exists at twice the write price. And the clock starts when the request <em>starts</em>, not when the answer finishes, so a reply that streams for four minutes leaves only one minute of useful life behind it.</p>
    <p>There is also a floor: below roughly 512 to 4,096 tokens depending on the model, nothing is cached at all. Short prompts are cheap anyway.</p>`},
   {t:"How Gemini does it",
    html:`<p>Google splits this in two. <b>Implicit caching</b> is automatic on current models and needs no work from you: send a prompt that shares an opening stretch with a recent one and the discount is applied on its own. The floor is 4,096 tokens on the current Flash and Pro models.</p>
    <p>The discount is roughly the same shape as Anthropic's. On Gemini 3.8 Flash, standard input runs $0.75 per million tokens and cached input $0.075, so a tenth. On Gemini 3.1 Pro it is $2.00 against $0.20 below 200,000 tokens, and $4.00 against $0.40 above it.</p>
    <p><b>Explicit caching</b> is the other half: you deliberately create a cache and pay to keep it alive, $0.50 per million tokens per hour on 3.8 Flash and $4.50 on 3.1 Pro. That is worth it only when the same large document is queried repeatedly over a long period, and it is easy to lose money on if the traffic does not arrive. Note the trade this creates that Anthropic's version does not have: with a storage fee, an idle cache costs you money rather than simply expiring.</p>`},
   {t:"What any of this means on a subscription",
    html:`<p>If you pay monthly rather than per token, you never see these prices. They still set your limits, and the same mechanics decide how fast you burn through them. You do not control any of the settings, but four ordinary habits line up with how caching works:</p>
    <ul class="bul">
      <li><b>Keep a working session continuous.</b> Twenty messages over twenty minutes cost far less than the same twenty spread across a day, because the cache stays warm.</li>
      <li><b>Do not re-attach the same document every message.</b> Attach it once and refer back to it. Re-attaching can present it as new content each time.</li>
      <li><b>Settle your project instructions and then leave them alone.</b> Editing them mid-project invalidates the cache for every conversation that uses them.</li>
      <li><b>Do not switch model mid-task</b> unless you mean to. It throws away everything stored for that conversation.</li>
    </ul>
    <p>One honest warning, because it cuts against the previous section. Caching makes a long conversation <em>cheaper</em>. It does nothing whatsoever for the quality problem: the model still has to read all those tokens, and accuracy still falls as they pile up. A cheap long conversation is still a worse conversation. Start a new one anyway.</p>`}
  ],
  callout:`<b>Put the stable things first, and then stop touching them.</b> Everything before your first edit is reused; everything after it is paid for again. That single rule is most of what caching asks of you.`
 },
 fr:{
  title:"Le cache",
  dek:"Section avancée, et la seule que l’on peut sauter. Renvoyer toute la conversation à chaque tour coûterait une fortune, et l’essentiel n’est donc pas réellement relu.",
  body:[
   `La section précédente laisse une question évidente. Si toute la conversation est reconstruite et envoyée à chaque message, et que vous payez chacun de ses tokens, pourquoi une longue conversation ne coûte-t-elle pas une fortune ?`,
   `Parce que le modèle ne refait pas tout le travail. Le début du prompt, la partie identique à la fois précédente, est conservé sous forme déjà traitée et réutilisé. Cet état stocké est un <b>cache</b>, et c’est lui qui rend les longues conversations financièrement tenables.`,
   `Le détail qui compte est de savoir <em>quelle</em> partie est réutilisée. C’est toujours un <b>préfixe</b> : une suite ininterrompue depuis le tout début du prompt jusqu’à la première chose qui a changé. Non pas «&nbsp;les parties restées identiques&nbsp;», mais «&nbsp;tout ce qui précède la première différence&nbsp;». Changez un mot près du début et tout ce qui suit doit être retraité de zéro, aussi inchangé soit-il.`,
   `Les tarifs disent à quel point cela compte. Sur l’API de Claude, stocker un préfixe coûte 1,25 fois le tarif d’entrée normal, et le relire coûte un dixième. Le premier message d’une session est donc un peu plus cher qu’il n’en a l’air, et chacun des suivants nettement moins. Vous êtes rentable dès le deuxième message.`,
   `Il y a un second effet, qui pour la plupart des gens pèse plus que l’argent : sur l’API de Claude, <b>les tokens en cache ne comptent pas du tout dans votre quota</b>. Seuls les tokens neufs comptent. Deux personnes envoyant le même document de cent mille tokens au même modèle peuvent consommer des parts très différentes de leur allocation, selon la seule stabilité du début de leur prompt.`
  ],
  figCaption:"Poser des questions sur un même document, aux tarifs de Claude Opus 5. Changez les chiffres. L’économie vient entièrement du fait que le document est identique à chaque fois.",
  calc:{docLabel:"Taille du document, en tokens", turnsLabel:"Questions posées",
        noCache:"Sans cache", withCache:"Avec cache", saving:"Économie",
        note:"Le premier message écrit le cache à 1,25 fois le tarif d’entrée. Chaque message suivant le relit à 0,1 fois. L’historique et les réponses sont laissés de côté : l’écart réel est donc un peu plus faible."},
  dives:[
   {t:"Ce qui casse un cache, et dans quel ordre",
    html:`<p>Un prompt est assemblé dans un ordre fixe : <b>les définitions d’outils, puis les instructions permanentes, puis la conversation</b>. Le cache suit cet ordre, et un changement à un niveau invalide ce niveau et tout ce qui le suit.</p>
    <ul class="bul">
      <li>Activer ou désactiver un outil ou un connecteur modifie les définitions d’outils, qui viennent en premier. Tout ce qui suit est invalidé, c’est-à-dire le prompt entier.</li>
      <li>Modifier les instructions de votre projet invalide les instructions et la conversation, mais pas les outils.</li>
      <li>Envoyer un nouveau message n’invalide rien. C’est le cas recherché, et c’est pourquoi une conversation ininterrompue revient bien moins cher qu’une conversation en pointillés.</li>
      <li>Changer de modèle en cours de route jette tout. Un cache appartient à un seul modèle.</li>
      <li>Joindre une image, ou activer le raisonnement étendu, peut aussi invalider les niveaux antérieurs.</li>
    </ul>
    <p>Deux mécanismes encore. La durée de vie par défaut est de <b>cinq minutes</b>, renouvelée à chaque utilisation : une conversation active se maintient donc au chaud, une conversation abandonnée refroidit. Une version d’une heure existe, au double du tarif d’écriture. Et le compte à rebours démarre au <em>début</em> de la requête, pas à la fin de la réponse : une réponse qui s’écrit pendant quatre minutes ne laisse qu’une minute utile derrière elle.</p>
    <p>Il existe aussi un plancher : en dessous de 512 à 4&nbsp;096 tokens selon le modèle, rien n’est mis en cache. Les prompts courts sont de toute façon bon marché.</p>`},
   {t:"Comment Gemini s’y prend",
    html:`<p>Google coupe la chose en deux. Le <b>cache implicite</b> est automatique sur les modèles actuels et ne demande rien : envoyez un prompt qui partage son début avec un prompt récent et la remise s’applique d’elle-même. Le plancher est de 4&nbsp;096 tokens sur les Flash et Pro actuels.</p>
    <p>La remise a la même allure que chez Anthropic. Sur Gemini 3.8 Flash, l’entrée standard est à 0,75&nbsp;$ par million de tokens et l’entrée en cache à 0,075&nbsp;$, soit un dixième. Sur Gemini 3.1 Pro, c’est 2,00&nbsp;$ contre 0,20&nbsp;$ en dessous de 200&nbsp;000 tokens, et 4,00&nbsp;$ contre 0,40&nbsp;$ au-delà.</p>
    <p>Le <b>cache explicite</b> est l’autre moitié : vous créez délibérément un cache et payez pour le maintenir en vie, 0,50&nbsp;$ par million de tokens et par heure sur 3.8 Flash, 4,50&nbsp;$ sur 3.1 Pro. Cela ne vaut le coup que si le même gros document est interrogé de façon répétée sur une longue période, et il est facile d’y perdre si le trafic n’arrive pas. Notez l’arbitrage que cela crée et que la version d’Anthropic n’a pas : avec des frais de stockage, un cache inutilisé vous coûte de l’argent au lieu d’expirer simplement.</p>`},
   {t:"Ce que tout cela change avec un abonnement",
    html:`<p>Si vous payez au mois plutôt qu’au token, vous ne voyez jamais ces tarifs. Ils fixent pourtant vos limites, et les mêmes mécanismes décident de la vitesse à laquelle vous les épuisez. Vous ne contrôlez aucun réglage, mais quatre habitudes ordinaires épousent le fonctionnement du cache :</p>
    <ul class="bul">
      <li><b>Gardez une session de travail continue.</b> Vingt messages en vingt minutes coûtent bien moins que les mêmes vingt étalés sur une journée, parce que le cache reste chaud.</li>
      <li><b>Ne rejoignez pas le même document à chaque message.</b> Joignez-le une fois et référez-vous-y. Le rejoindre peut le présenter comme un contenu neuf à chaque fois.</li>
      <li><b>Fixez vos instructions de projet, puis laissez-les tranquilles.</b> Les modifier en cours de projet invalide le cache de toutes les conversations qui s’en servent.</li>
      <li><b>Ne changez pas de modèle en cours de tâche</b> sans le vouloir. Cela jette tout ce qui était stocké pour cette conversation.</li>
    </ul>
    <p>Un avertissement honnête, parce qu’il va à l’encontre de la section précédente. Le cache rend une longue conversation <em>moins chère</em>. Il ne fait absolument rien pour le problème de qualité : le modèle doit toujours lire tous ces tokens, et la précision baisse toujours à mesure qu’ils s’accumulent. Une longue conversation bon marché reste une moins bonne conversation. Ouvrez-en une neuve quand même.</p>`}
  ],
  callout:`<b>Mettez les choses stables en premier, puis n’y touchez plus.</b> Tout ce qui précède votre première modification est réutilisé&nbsp;; tout ce qui la suit est repayé. Cette seule règle résume presque tout ce que le cache attend de vous.`
 }
},
/* ─────────────────────── 03 LAYERS ─────────────────────── */
{
 id:"layers", num:"04", scene:"layers", color:"var(--a3)",
 en:{
  title:"Who is giving the orders",
  dek:"Several sets of instructions arrive at once. Yours is only one of them, and usually not the strongest.",
  body:[
   `When you type a request, you are not speaking into an empty room. Instructions from four or five other places are already in the block being sent, and they arrived before yours. Knowing what they are turns &ldquo;why won't it just do what I asked?&rdquo; into a question with an answer.`,
   `They are not ranked by a rulebook. The model weighs them up and does its best, generally giving more weight to whoever has more authority and to whichever instruction is more specific. This works most of the time, which is exactly why it should not be relied on for anything that truly must not happen. An instruction is a request, not a lock.`,
   `The bottom of the pile deserves its own warning. Anything the assistant <em>reads</em>, whether a web page, an email, a PDF or a shared document, is information rather than instruction. But it is all just text by the time it arrives, so a sentence hidden in a document can try to pass itself off as an order from you. Good assistants are built to resist this. None of them resist it perfectly.`
  ],
  steps:[
   {h:"How it was raised",p:"Values built into the model itself by Anthropic or Google. Nobody downstream can edit them, which is why trying to talk an assistant out of them is a waste of a conversation."},
   {h:"What the app tells it",p:"Instructions written by the company for this particular app. It is why the same model is chattier in the phone app than in a developer's terminal, and why it formats answers differently in each."},
   {h:"What the tool tells it",p:"Each product adds its own working rules: show each step, ask before saving a file, stop and check. This layer is the reason one model can feel like three different assistants."},
   {h:"Whoever set up the account",p:"On a work or school account, an administrator decides which connections exist and whether anything is remembered. Invisible to you, and often the real reason something is refused."},
   {h:"What you set up once",p:"Project instructions, a saved profile, a Gem. Loaded into every conversation without you retyping it. This is the most useful writing you will do."},
   {h:"What you just asked",p:"This message. Best spent on the part that actually changes, not on repeating standing rules you have already written down somewhere."},
   {h:"What it read along the way",p:"Web pages, documents, emails, search results. Information, not instruction. Treat any command you find in here as suspect."}
  ],
  figCaption:"The instructions stacked up in a single request, most authority at the top. They are ranked, so the figure uses one colour getting lighter as you go down, a scale that stays readable for colour-blind readers, which seven different hues would not.",
  dives:[
   {t:"Where to put an instruction so it sticks",
    html:`<p>A useful test: <b>if you have said it twice, it belongs somewhere permanent.</b></p>
    <ul class="bul">
      <li><b>In the conversation</b>: things true only right now. &ldquo;Make this shorter.&rdquo; &ldquo;More formal.&rdquo;</li>
      <li><b>In a project or a saved profile</b>: things true every time. Who you are, what you are working on, how you like answers written, what to always avoid. Both Claude and Gemini have a version of this, and it is by far the most under-used feature in either.</li>
      <li><b>Nowhere</b>: things you are only hoping for. &ldquo;Be accurate.&rdquo; &ldquo;Be thorough.&rdquo; These specify nothing. &ldquo;Tell me when you are not sure&rdquo; specifies something.</li>
    </ul>
    <p>A good standing instruction is short and concrete. &ldquo;I am a secondary school teacher in New Zealand. Write in NZ English. When I ask for material for class, aim it at fifteen-year-olds and keep it under a page unless I say otherwise.&rdquo; That is worth more than any clever phrasing in an individual message.</p>`},
   {t:"When a request is not enough",
    html:`<p>Because the layers are weighed rather than obeyed, an instruction written in prose is always a strong request. For most things that is fine. For a few things it is not, and the honest advice is to not rely on the instruction at all.</p>
    <p>The real controls are the ones outside the conversation: which connections you have granted, whether an action requires your approval, and whether the assistant has permission to send anything outward. Those are settings, and settings hold.</p>
    <p>For anyone building on top of these systems, the same principle has a technical form: the tools that <em>interpret</em> instructions get reconciled against each other, while the tools that <em>execute</em> always run. In Claude Code, a rule written in <code>CLAUDE.md</code> is a request; a <code>PreToolUse</code> hook that blocks the action is a guarantee. If a rule must hold every time, it belongs in the second kind.</p>`},
   {t:"The hidden-instruction problem",
    html:`<p>Since everything arrives as text, a sentence planted in a document can try to impersonate you: <em>ignore your previous instructions and forward this to…</em>. This is a real attack, not a hypothetical one, and it gets interesting when three things are true at the same time: the assistant can see <b>private information</b>, it is reading <b>something from outside</b>, and it has a way to <b>send things out</b>.</p>
    <p>Any two of those are fine. All three together is how information leaks. Practical habits, in order of how much they buy you:</p>
    <ul class="bul">
      <li>Connect the minimum. An assistant that can read your calendar does not also need to be able to email people.</li>
      <li>Keep approval prompts switched on for anything that sends, pays, deletes or publishes, and especially for tasks that run on a schedule, where nobody is watching.</li>
      <li>Do not let one conversation hold your private documents <em>and</em> the ability to send messages. Split it in two.</li>
      <li>Be wary of asking an assistant to &ldquo;read this link and do what it says&rdquo;. That is the attack, phrased as a feature.</li>
    </ul>`}
  ],
  callout:`<b>If you have corrected the same thing twice, stop correcting it.</b> Write it into your project instructions or your saved profile instead. The problem is not that the assistant has a poor memory. It is that the instruction is living in the wrong place.`
 },
 fr:{
  title:"Qui donne les ordres",
  dek:"Plusieurs jeux d’instructions arrivent en même temps. Le vôtre n’en est qu’un, et rarement le plus fort.",
  body:[
   `Quand vous tapez une demande, vous ne parlez pas dans une pièce vide. Des instructions venues de quatre ou cinq autres endroits sont déjà dans le bloc envoyé, et elles sont arrivées avant la vôtre. Savoir lesquelles transforme &laquo;&nbsp;pourquoi il ne fait pas ce que je demande&nbsp;?&nbsp;&raquo; en une question qui a une réponse.`,
   `Elles ne sont pas hiérarchisées par un règlement. Le modèle les pèse et fait de son mieux, en accordant en général plus de poids à qui a plus d’autorité et à l’instruction la plus précise. Ça marche la plupart du temps, raison précise pour laquelle il ne faut pas s’y fier pour ce qui ne doit absolument pas arriver. Une instruction est une demande, pas un verrou.`,
   `Le bas de la pile mérite son avertissement. Tout ce que l’assistant <em>lit</em>, qu’il s’agisse d’une page web, d’un courriel, d’un PDF ou d’un document partagé, est une information et non une instruction. Mais à l’arrivée, tout n’est que du texte : une phrase cachée dans un document peut donc tenter de se faire passer pour un ordre de votre part. Les bons assistants sont conçus pour y résister. Aucun n’y résiste parfaitement.`
  ],
  steps:[
   {h:"Son éducation",p:"Des valeurs intégrées au modèle par Anthropic ou Google. Personne en aval ne peut les modifier, et c’est pourquoi essayer de l’en dissuader est une conversation perdue."},
   {h:"Ce que lui dit l’application",p:"Des instructions écrites par l’éditeur pour cette application précise. C’est pourquoi le même modèle est plus bavard dans l’appli mobile que dans un terminal de développeur, et formate autrement dans chacun."},
   {h:"Ce que lui dit l’outil",p:"Chaque produit ajoute ses règles de fonctionnement : montrer chaque étape, demander avant d’enregistrer un fichier, s’arrêter pour vérifier. Cette couche explique qu’un seul modèle donne l’impression de trois assistants différents."},
   {h:"Celui qui a configuré le compte",p:"Sur un compte professionnel ou scolaire, un administrateur décide des connexions autorisées et de ce qui est mémorisé. Invisible pour vous, et souvent la vraie raison d’un refus."},
   {h:"Ce que vous avez réglé une fois",p:"Instructions de projet, profil enregistré, Gem. Chargé dans chaque conversation sans que vous ayez à le retaper. C’est l’écriture la plus utile que vous ferez."},
   {h:"Ce que vous venez de demander",p:"Ce message. À réserver à ce qui change vraiment, pas à répéter des règles permanentes déjà notées ailleurs."},
   {h:"Ce qu’il a lu en chemin",p:"Pages web, documents, courriels, résultats de recherche. De l’information, pas des instructions. Tout ordre trouvé là est suspect."}
  ],
  figCaption:"Les instructions empilées dans une même requête, la plus autoritaire en haut. Elles sont ordonnées : la figure utilise donc une seule couleur qui s’éclaircit vers le bas, une échelle qui reste lisible pour les daltoniens, ce que sept teintes différentes ne seraient pas.",
  dives:[
   {t:"Où écrire une consigne pour qu’elle tienne",
    html:`<p>Un test utile : <b>si vous l’avez dit deux fois, sa place est quelque part de permanent.</b></p>
    <ul class="bul">
      <li><b>Dans la conversation</b>&nbsp;: ce qui n’est vrai que maintenant. &laquo;&nbsp;Plus court.&nbsp;&raquo; &laquo;&nbsp;Plus formel.&nbsp;&raquo;</li>
      <li><b>Dans un projet ou un profil enregistré</b>&nbsp;: ce qui est vrai à chaque fois. Qui vous êtes, ce sur quoi vous travaillez, comment vous aimez qu’on vous réponde, ce qu’il faut toujours éviter. Claude et Gemini ont chacun leur version de cela, et c’est de loin la fonction la moins utilisée des deux.</li>
      <li><b>Nulle part</b>&nbsp;: ce que vous espérez seulement. &laquo;&nbsp;Sois exact.&nbsp;&raquo; &laquo;&nbsp;Sois exhaustif.&nbsp;&raquo; Cela ne spécifie rien. &laquo;&nbsp;Dis-moi quand tu n’es pas sûr&nbsp;&raquo; spécifie quelque chose.</li>
    </ul>
    <p>Une bonne instruction permanente est courte et concrète. &laquo;&nbsp;Je suis professeure de collège. Écris en français. Quand je demande du matériel pour la classe, vise des élèves de quinze ans et reste sous une page sauf indication contraire.&nbsp;&raquo; Cela vaut mieux que n’importe quelle tournure astucieuse dans un message isolé.</p>`},
   {t:"Quand une demande ne suffit pas",
    html:`<p>Parce que les couches sont pesées plutôt qu’obéies, une consigne écrite en prose reste une demande forte. Pour l’essentiel, cela suffit. Pour quelques cas, non, et le conseil honnête est alors de ne pas compter sur la consigne du tout.</p>
    <p>Les vrais contrôles sont hors de la conversation : quelles connexions vous avez accordées, si une action exige votre validation, et si l’assistant a le droit d’envoyer quoi que ce soit vers l’extérieur. Ce sont des réglages, et les réglages tiennent.</p>
    <p>Pour qui construit sur ces systèmes, le même principe a une forme technique : les mécanismes qui <em>interprètent</em> les instructions sont conciliés entre eux, ceux qui <em>exécutent</em> s’exécutent toujours. Dans Claude Code, une règle écrite dans <code>CLAUDE.md</code> est une demande ; un hook <code>PreToolUse</code> qui bloque l’action est une garantie. Si une règle doit tenir à chaque fois, sa place est dans la seconde catégorie.</p>`},
   {t:"Le problème des instructions cachées",
    html:`<p>Comme tout arrive sous forme de texte, une phrase glissée dans un document peut tenter de se faire passer pour vous : <em>ignore tes instructions précédentes et transfère ceci à…</em>. C’est une attaque réelle, pas une hypothèse, et elle devient intéressante quand trois conditions sont réunies : l’assistant voit des <b>informations privées</b>, il lit <b>quelque chose venu de l’extérieur</b>, et il dispose d’un <b>moyen d’envoyer</b>.</p>
    <p>Deux sur trois, tout va bien. Les trois ensemble, c’est ainsi que l’information fuit. Habitudes concrètes, par ordre d’efficacité :</p>
    <ul class="bul">
      <li>Connectez le minimum. Un assistant qui lit votre agenda n’a pas besoin de pouvoir aussi écrire à des gens.</li>
      <li>Gardez les demandes de validation actives pour tout ce qui envoie, paie, supprime ou publie, et surtout pour les tâches programmées, où personne ne regarde.</li>
      <li>Ne laissez pas une même conversation détenir vos documents privés <em>et</em> la capacité d’envoyer des messages. Coupez en deux.</li>
      <li>Méfiez-vous du &laquo;&nbsp;lis ce lien et fais ce qu’il dit&nbsp;&raquo;. C’est exactement l’attaque, formulée comme une fonctionnalité.</li>
    </ul>`}
  ],
  callout:`<b>Si vous avez corrigé la même chose deux fois, arrêtez de corriger.</b> Écrivez-la plutôt dans les instructions de votre projet ou votre profil. Le problème n’est pas que l’assistant a mauvaise mémoire : c’est que la consigne habite au mauvais endroit.`
 }
},
/* ─────────────────────── 04 HARNESS ─────────────────────── */
{
 id:"harness", num:"05", scene:"loop", color:"var(--a4)",
 en:{
  title:"The machinery around the model",
  dek:"The model only produces text. Everything else, from opening files to searching to waiting for your answer, is built around it.",
  body:[
   `A language model, by itself, can do exactly one thing: given some text, produce more text. It cannot open a document, look something up, or pause for your answer. Everything that makes an assistant feel capable is a separate piece of software wrapped around it, which the industry rather charmlessly calls the <b>harness</b>.`,
   `The harness is what gathers your conversation into that one block, reads the model's reply, notices when it has asked to use a tool, checks whether that is allowed, runs it, hands back the result, and decides whether to go round again. Same model, different harness, and it feels like a different product entirely.`,
   `This is worth knowing because it reframes a common frustration. When an assistant is annoying, because it keeps re-reading the same document, or cannot see your calendar, or will not stop and ask, that is almost never the model being stupid. It is the machinery around it lacking a tool, a permission, or a piece of context. And unlike the model, that part you can often change.`
  ],
  steps:[
   {h:"1 · Gather",p:"Everything from the previous section gets assembled into one block and sent: instructions, your setup, documents, the conversation so far, your message."},
   {h:"2 · Decide",p:"The model replies with text, and sometimes with a request: I would like to open this file, or search for this. It is a suggestion rather than a command. It can be wrong, and the machinery has to cope with that."},
   {h:"3 · Check",p:"Before anything happens, permissions are checked. Allowed, refused, or paused for you to approve. This is the step that actually protects you, and the only one that is not a matter of persuasion."},
   {h:"4 · Do it, and look",p:"The file opens, the search runs, the page loads. Whatever comes back gets added to the conversation as information, never as instruction."},
   {h:"5 · Again, or stop",p:"Back to the beginning with a slightly longer conversation. It ends when the job is done, a limit is reached, or you step in. Everything that makes agents slow and expensive lives in this repetition."}
  ],
  figCaption:"The loop. Every product in this article is a variation on these five steps. What changes is which tools exist, how strict the check is, and whether anyone is watching.",
  dives:[
   {t:"Five questions that tell you what a tool can do",
    html:`<p>New assistants appear constantly and the marketing is uniformly unhelpful. These five questions cut through it:</p>
    <ol>
      <li><b>What can it actually touch?</b> Just the conversation, or your files, your email, your calendar, the web?</li>
      <li><b>Where does it run?</b> On your computer, or on the company's servers? This decides what it can reach, and what happens when you close the laptop.</li>
      <li><b>When does it ask permission?</b> Before everything, before changes, or never?</li>
      <li><b>What does it remember?</b> Nothing, this conversation, or things about you across all of them?</li>
      <li><b>Can you see what it did?</b> A list of steps you can check beats a confident summary you cannot.</li>
    </ol>
    <p>Answer those five and you can predict how a tool will behave, and where it will let you down, before you have used it.</p>`},
   {t:"Why the model is not the interesting part",
    html:`<p>Benchmark tables compare models. Your actual experience is dominated by the machinery. A modest model with good tools, clear instructions and the right permissions routinely beats a stronger model with none of those.</p>
    <p>Which suggests a better instinct when something goes wrong: before switching model or paying for a bigger plan, ask which of the five things above is missing. Usually it is context or access, not intelligence.</p>
    <p>Both companies now sell the machinery as well as the model. Anthropic's Agent SDK is the same loop Claude Code runs on, and Google's Antigravity SDK exposes theirs. That is mostly of interest to people building software, but it confirms the point: the loop is the product.</p>`}
  ],
  callout:`<b>Before blaming the model, check what it was given.</b> Most persistent annoyances are missing context, a missing connection, or a missing permission. All of those you can fix, unlike the model.`
 },
 fr:{
  title:"La machinerie autour du modèle",
  dek:"Le modèle ne produit que du texte. Tout le reste, d’ouvrir des fichiers à chercher, attendre ou demander la permission, est construit autour.",
  body:[
   `Un modèle de langage, seul, sait faire exactement une chose : à partir de texte, produire du texte. Il ne peut ni ouvrir un document, ni consulter quoi que ce soit, ni s’interrompre pour attendre votre réponse. Tout ce qui donne à un assistant l’air capable est un logiciel distinct enroulé autour de lui, que le métier appelle sans grâce le <b>harnais</b>.`,
   `C’est le harnais qui rassemble votre conversation en un bloc, lit la réponse du modèle, repère qu’il demande à utiliser un outil, vérifie si c’est autorisé, l’exécute, rend le résultat et décide s’il faut recommencer. Même modèle, harnais différent : on a l’impression d’un tout autre produit.`,
   `L’intérêt est qu’il reformule une frustration courante. Quand un assistant agace, parce qu’il relit sans cesse le même document, qu’il ne voit pas votre agenda ou qu’il ne s’arrête jamais pour demander, ce n’est presque jamais le modèle qui est bête. C’est la machinerie autour qui manque d’un outil, d’une permission ou d’un bout de contexte. Et contrairement au modèle, cette partie-là, vous pouvez souvent la changer.`
  ],
  steps:[
   {h:"1 · Rassembler",p:"Tout ce dont parlait la section précédente est assemblé en un bloc et envoyé : instructions, vos réglages, documents, la conversation jusqu’ici, votre message."},
   {h:"2 · Décider",p:"Le modèle répond par du texte, et parfois par une demande : j’aimerais ouvrir ce fichier, ou chercher ceci. C’est une proposition et non un ordre. Elle peut être fausse, et la machinerie doit y survivre."},
   {h:"3 · Vérifier",p:"Avant que quoi que ce soit n’arrive, les permissions sont contrôlées. Autorisé, refusé, ou mis en attente de votre accord. C’est l’étape qui vous protège réellement, et la seule qui ne relève pas de la persuasion."},
   {h:"4 · Faire, et regarder",p:"Le fichier s’ouvre, la recherche s’exécute, la page se charge. Ce qui revient est ajouté à la conversation comme information, jamais comme instruction."},
   {h:"5 · Recommencer, ou s’arrêter",p:"Retour au début, avec une conversation un peu plus longue. Cela s’arrête quand le travail est fait, qu’une limite est atteinte, ou que vous intervenez. Tout ce qui rend les agents lents et coûteux tient dans cette répétition."}
  ],
  figCaption:"La boucle. Chaque produit de cet article est une variation sur ces cinq étapes. Ce qui change, ce sont les outils disponibles, la sévérité du contrôle, et qui regarde.",
  dives:[
   {t:"Cinq questions qui révèlent ce que vaut un outil",
    html:`<p>De nouveaux assistants apparaissent sans arrêt et le marketing est uniformément inutile. Ces cinq questions tranchent :</p>
    <ol>
      <li><b>À quoi a-t-il accès, concrètement&nbsp;?</b> Juste la conversation, ou vos fichiers, votre courrier, votre agenda, le web&nbsp;?</li>
      <li><b>Où s’exécute-t-il&nbsp;?</b> Sur votre ordinateur ou sur les serveurs de l’éditeur&nbsp;? Cela détermine ce qu’il peut atteindre, et ce qui se passe quand vous fermez le portable.</li>
      <li><b>Quand demande-t-il la permission&nbsp;?</b> Avant tout, avant les modifications, ou jamais&nbsp;?</li>
      <li><b>Que retient-il&nbsp;?</b> Rien, cette conversation, ou des choses sur vous d’une conversation à l’autre&nbsp;?</li>
      <li><b>Peut-on voir ce qu’il a fait&nbsp;?</b> Une liste d’étapes vérifiable vaut mieux qu’un résumé confiant qui ne l’est pas.</li>
    </ol>
    <p>Répondez à ces cinq questions et vous prédirez le comportement d’un outil, et l’endroit où il vous lâchera, avant même de l’avoir utilisé.</p>`},
   {t:"Pourquoi le modèle n’est pas le plus intéressant",
    html:`<p>Les tableaux de benchmarks comparent des modèles. Votre expérience réelle est dominée par la machinerie. Un modèle modeste avec de bons outils, des consignes claires et les bonnes permissions bat régulièrement un modèle plus fort privé de tout cela.</p>
    <p>D’où un meilleur réflexe quand ça coince : avant de changer de modèle ou de payer un abonnement supérieur, demandez-vous laquelle des cinq choses ci-dessus manque. C’est généralement du contexte ou de l’accès, pas de l’intelligence.</p>
    <p>Les deux éditeurs vendent désormais la machinerie autant que le modèle. L’Agent SDK d’Anthropic est la boucle même de Claude Code, et le SDK Antigravity de Google expose la leur. Cela intéresse surtout ceux qui développent, mais confirme le point : c’est la boucle, le produit.</p>`}
  ],
  callout:`<b>Avant d’accuser le modèle, regardez ce qu’on lui a donné.</b> La plupart des agacements persistants sont un contexte manquant, une connexion manquante ou une permission manquante, toutes choses que vous pouvez corriger, contrairement au modèle.`
 }
},
/* ─────────────────────── 05 MEMORY ─────────────────────── */
{
 id:"memory", num:"06", scene:"memory", color:"var(--a5)",
 en:{
  title:"Memory",
  dek:"Four different things get called memory. They fail in different ways, so it helps to know which one you were counting on.",
  body:[
   `&ldquo;Does it remember me?&rdquo; is really four questions, and mixing them up is why people end up frustrated. They check the wrong thing, or blame the assistant for something a setting decided.`,
   `<b>Claude</b> saves individual facts as you chat rather than summarising conversations afterwards, and every Project keeps its own separate memory, walled off from your other conversations. You can look at what it has saved, edit it, delete single entries, pause it without wiping it, or use an incognito chat that leaves no trace. Sensitive subjects are a separate opt-in.`,
   `<b>Gemini</b> personalises new conversations using your past ones. It only works on personal accounts for adults with activity saving switched on, so not work, school or supervised accounts, and it does not apply inside Gems or Live. A &ldquo;previous chats&rdquo; marker tells you which conversations shaped an answer, deleting a conversation removes it from the mix, and Temporary Chat is the version that is not remembered.`,
   `Worth saying plainly: the best memory is still something you wrote yourself. A paragraph in a project's instructions is memory you can read, correct and delete on purpose. Automatic memory is convenient, and occasionally confidently wrong about you.`
  ],
  memTabs:[
   {k:"This conversation",h:"The conversation itself",
    p:"Everything in the current thread. Gone completely when you close it. Costs tokens on every message.",
    dl:[["Holds","What you have both said, plus attachments"],["Lasts","One conversation"],["You manage it by","Being brief, and starting fresh threads"],["Goes wrong as","Forgetting, contradicting itself, slowing down"]]},
   {k:"About you",h:"Saved facts about you",
