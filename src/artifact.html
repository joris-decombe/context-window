    p:"Things picked up automatically and reused later. Claude's memory, Gemini's personalisation from past chats.",
    dl:[["Holds","Preferences, what you are working on, past decisions"],["Lasts","Until you edit or delete it"],["You manage it by","Reviewing the list; pausing; incognito or Temporary Chat"],["Goes wrong as","Out-of-date facts, wrong conclusions, awkward crossover"]]},
   {k:"What you wrote",h:"Instructions you wrote yourself",
    p:"A project's instructions, a saved profile, a Gem. Predictable, visible, and yours to change.",
    dl:[["Holds","Who you are, how you want answers, standing rules"],["Lasts","Until you change it"],["You manage it by","Editing it. That is the whole point"],["Goes wrong as","Getting too long; it is sent with every message"]]},
   {k:"Looking things up",h:"Looking things up on demand",
    p:"Searching your old conversations, your drive, or the web. Nothing is remembered. Things are found when needed.",
    dl:[["Holds","Nothing; it goes and looks"],["Lasts","Always current"],["You manage it by","Choosing what it is allowed to search"],["Goes wrong as","Missing things, or dragging in far too much"]]}
  ],
  figCaption:"Four systems, four ways of letting you down. When an assistant &ldquo;forgets&rdquo;, work out which of these you were relying on.",
  dives:[
   {t:"What belongs where",
    html:`<p><b>Standing rules</b> belong in instructions you wrote: a project, a profile, a Gem. Written once, applied every time, fixable when wrong.</p>
    <p><b>Preferences</b>, such as how you like things written or what you are busy with this term, are what automatic memory is genuinely good at. Let it. Then glance at the list occasionally, because it accumulates.</p>
    <p><b>Facts about the world</b> belong in a lookup, never in memory. A saved note about a price, a date or a rule will outlive its accuracy without ever mentioning that it has.</p>
    <p><b>Anything private</b> belongs in neither by default. Both products give you a per-conversation off switch, incognito on Claude and Temporary Chat on Gemini, and keep sensitive categories behind a separate opt-in. For medical, financial or family matters, those switches are what they are for.</p>`},
   {t:"A habit worth having",
    html:`<p>Once a month, open the memory settings and read what has been saved about you. It takes five minutes and it is worth more than any prompting technique, for a simple reason: a wrong fact in memory is wrong in every future conversation, quietly, without ever announcing itself.</p>
    <p>Typical things worth deleting: a job you no longer do, a preference you expressed once about one document and never again, a conclusion the assistant drew about you that you never actually said, and anything you would not want to see reappear in a conversation you were screen-sharing.</p>`}
  ],
  callout:`<b>Read your own memory once a month.</b> Both products let you see and delete individual entries. Five minutes of tidying beats any clever phrasing, because a wrong fact in there is wrong everywhere, forever.`
 },
 fr:{
  title:"La mémoire",
  dek:"Quatre choses différentes s’appellent mémoire. Elles échouent différemment : mieux vaut savoir sur laquelle on comptait.",
  body:[
   `&laquo;&nbsp;Est-ce qu’il se souvient de moi&nbsp;?&nbsp;&raquo; est en fait quatre questions, et les confondre est la source de la frustration. On vérifie la mauvaise chose, ou l’on reproche à l’assistant ce qu’un réglage a décidé.`,
   `<b>Claude</b> enregistre des faits isolés au fil de la conversation plutôt que de résumer après coup, et chaque Projet a sa mémoire propre, isolée de vos autres conversations. Vous pouvez consulter ce qui a été retenu, le modifier, supprimer une entrée, mettre en pause sans tout effacer, ou utiliser une conversation incognito qui ne laisse aucune trace. Les sujets sensibles font l’objet d’une activation distincte.`,
   `<b>Gemini</b> personnalise les nouvelles conversations à partir des précédentes. Cela ne fonctionne que sur un compte personnel d’adulte avec l’enregistrement de l’activité actif, donc ni compte professionnel, ni scolaire, ni supervisé. Cela ne s’applique pas non plus dans les Gems ni dans Live. Un repère &laquo;&nbsp;conversations précédentes&nbsp;&raquo; indique lesquelles ont façonné une réponse, supprimer une conversation la retire du mélange, et le mode Temporaire est la version dont on ne se souvient pas.`,
   `À dire franchement : la meilleure mémoire reste celle que vous avez écrite. Un paragraphe dans les instructions d’un projet est une mémoire que vous pouvez lire, corriger et supprimer volontairement. La mémoire automatique est commode, et parfois confiante et fausse à votre sujet.`
  ],
  memTabs:[
   {k:"Cette conversation",h:"La conversation elle-même",
    p:"Tout ce que contient le fil en cours. Entièrement perdu à sa fermeture. Coûte des tokens à chaque message.",
    dl:[["Contient","Ce que vous vous êtes dit, plus les pièces jointes"],["Durée","Une conversation"],["Vous la gérez en","Restant bref et en ouvrant des fils neufs"],["Se dégrade en","Oublis, contradictions, ralentissement"]]},
   {k:"À votre sujet",h:"Des faits enregistrés sur vous",
    p:"Des éléments captés automatiquement et réutilisés plus tard. La mémoire de Claude, la personnalisation de Gemini.",
    dl:[["Contient","Préférences, projets en cours, décisions passées"],["Durée","Jusqu’à modification ou suppression"],["Vous la gérez en","Relisant la liste, en la mettant en pause, en incognito"],["Se dégrade en","Faits périmés, conclusions fausses, mélanges gênants"]]},
   {k:"Ce que vous écrivez",h:"Les instructions que vous avez écrites",
    p:"Les instructions d’un projet, un profil enregistré, un Gem. Prévisible, visible, et modifiable à volonté.",
    dl:[["Contient","Qui vous êtes, comment vous voulez les réponses, vos règles"],["Durée","Jusqu’à ce que vous la changiez"],["Vous la gérez en","La modifiant. C’est tout l’intérêt"],["Se dégrade en","Devenant trop longue ; elle part à chaque message"]]},
   {k:"Aller chercher",h:"Aller chercher à la demande",
    p:"Fouiller vos anciennes conversations, votre drive ou le web. Rien n’est retenu. Les choses sont retrouvées au besoin.",
    dl:[["Contient","Rien ; il va voir"],["Durée","Toujours à jour"],["Vous la gérez en","Choisissant ce qu’il a le droit de fouiller"],["Se dégrade en","Passant à côté, ou en ramenant beaucoup trop"]]}
  ],
  figCaption:"Quatre systèmes, quatre façons de vous faire défaut. Quand un assistant &laquo;&nbsp;oublie&nbsp;&raquo;, cherchez d’abord sur lequel vous comptiez.",
  dives:[
   {t:"Quoi mettre où",
    html:`<p><b>Les règles permanentes</b> vont dans ce que vous écrivez : un projet, un profil, un Gem. Écrit une fois, appliqué à chaque fois, corrigeable quand c’est faux.</p>
    <p><b>Les préférences</b>, comme votre style ou ce qui vous occupe ce trimestre, sont exactement ce que la mémoire automatique fait bien. Laissez-la faire, puis jetez un œil à la liste de temps en temps, parce qu’elle s’accumule.</p>
    <p><b>Les faits sur le monde</b> relèvent de la recherche, jamais de la mémoire. Une note enregistrée sur un prix, une date ou une règle survivra à son exactitude sans jamais le signaler.</p>
    <p><b>Tout ce qui est privé</b> ne relève par défaut ni de l’une ni de l’autre. Les deux produits offrent un interrupteur par conversation, incognito chez Claude et mode Temporaire chez Gemini, et placent les catégories sensibles derrière une activation distincte. Pour le médical, le financier ou le familial, ces interrupteurs sont faits pour ça.</p>`},
   {t:"Une habitude à prendre",
    html:`<p>Une fois par mois, ouvrez les réglages de mémoire et lisez ce qui a été enregistré sur vous. Cinq minutes, et cela vaut mieux que n’importe quelle technique de formulation, pour une raison simple : un fait faux en mémoire est faux dans toutes les conversations à venir, discrètement, sans jamais s’annoncer.</p>
    <p>Ce qu’on gagne typiquement à supprimer : un métier que vous ne faites plus, une préférence exprimée une fois pour un seul document, une conclusion que l’assistant a tirée sur vous sans que vous l’ayez dite, et tout ce que vous n’aimeriez pas voir resurgir pendant un partage d’écran.</p>`}
  ],
  callout:`<b>Relisez votre propre mémoire une fois par mois.</b> Les deux produits permettent de voir et de supprimer chaque entrée. Cinq minutes de ménage valent mieux que n’importe quelle astuce de formulation : un fait faux là-dedans est faux partout, indéfiniment.`
 }
},
/* ─────────────────────── 06 TOOLS ─────────────────────── */
{
 id:"tools", num:"07", scene:"tools", color:"var(--a6)",
 en:{
  title:"Giving it hands",
  dek:"An assistant that can only talk is a very expensive conversation. Three things turn it into something that can actually do the job.",
  body:[
   `On its own, an assistant can only discuss your document. It cannot open it. Everything that closes that gap works the same way underneath: the machinery describes what is available, the model asks to use one of them, and the machinery does it and reports back.`,
   `<b>Connections</b> are the first kind: your drive, your calendar, your email, a web browser. This is the single biggest upgrade available to most people, and the one most often left switched off. An assistant that can see the actual spreadsheet beats one working from a copy you pasted last Tuesday, every time. There is now a shared standard for these connections, which is why the same integration increasingly works in both Claude and Gemini.`,
   `<b>Saved instructions for a recurring job</b> are the second. Claude calls them skills; Gemini's Gems do something similar. Think of a recipe card: written once, in plain language, for something you do repeatedly. &ldquo;When I give you a set of lecture notes, produce ten flashcards in this format, and flag anything that looks like it will be examined.&rdquo; The clever part is that these stay out of the way until they are relevant, so you can have dozens without slowing anything down.`,
   `<b>Helpers</b> are the third. For a job that involves reading a lot and reporting a little, the assistant can send a separate copy of itself off to do the reading in its own conversation and come back with a summary. You mostly notice this as a research mode that goes away for two minutes and returns with something substantial.`
  ],
  figCaption:"The model can only produce text. The machinery around it turns that text into actions, and the last row is the only one the model does not get a say in.",
  dives:[
   {t:"Getting connections right",
    html:`<p>Connections are where most of the value and all of the risk live, so a few habits are worth forming.</p>
    <ul class="bul">
      <li><b>Start with read-only.</b> Being able to see your calendar is most of the benefit; being able to change it is most of the risk.</li>
      <li><b>Connect one thing at a time</b> and use it for a week before adding the next. You will learn what it is actually good at, which is rarely what you assumed.</li>
      <li><b>Point at the source, not a copy.</b> The whole point is that it reads the live document.</li>
      <li><b>Narrow the folder.</b> If the work lives in one folder, grant one folder. This is not only about security. A narrow scope also stops the assistant wandering into irrelevant files and confusing itself.</li>
      <li><b>Keep approvals on for sending and deleting</b>, however tedious, until you have watched the same task go right several times.</li>
    </ul>`},
   {t:"If you build things",
    html:`<p>The plain-language names above have technical ones, and the distinctions matter once you are building rather than using.</p>
    <ul class="bul">
      <li><b>MCP</b>, the Model Context Protocol, is the shared standard for connections. A service ships one server; any compliant client can use it. Claude, Cowork, Claude Code, Antigravity and Gemini Spark all speak it, so an integration written once works in both ecosystems.</li>
      <li><b>Skills</b> are folders containing a <code>SKILL.md</code> plus any reference files and scripts. They work across claude.ai, Claude Code, the Agent SDK and the developer platform; Antigravity CLI carries its own equivalent.</li>
      <li><b>Sub-agents</b> run their own loop in their own context window and return a summary. They are the mechanism behind the &ldquo;helpers&rdquo; above.</li>
      <li><b>Hooks</b> fire on a lifecycle event and run regardless of what the model decides. Everything else on this page is a request; a hook is the only guarantee.</li>
      <li><b>Plugins</b> bundle the lot into something installable, so a setup can be shared across repositories or across a team.</li>
    </ul>
    <p>The design idea worth stealing, even if you never write one, is <b>progressive disclosure</b>. A skill exposes only its name and description until the model judges it relevant; the body loads then, and its reference files only if the task reaches them. Almost none of it is resident, so the amount of expertise you can attach is effectively unlimited. You can apply the same principle by hand: keep your standing instructions to a short index of what exists and where, and let the assistant read the detail when it needs it. For a project instruction block that has grown bloated, that is the single highest-value edit.</p>`}
  ],
  callout:`<b>Connect something this week.</b> Most people are using one of these assistants at a fraction of its usefulness because it cannot see any of their actual material. One folder, read-only, is enough to feel the difference.`
 },
 fr:{
  title:"Lui donner des mains",
  dek:"Un assistant qui ne sait que parler est une conversation très coûteuse. Trois choses en font quelque chose qui fait vraiment le travail.",
  body:[
   `Seul, un assistant ne peut que discuter de votre document. Il ne peut pas l’ouvrir. Tout ce qui comble cet écart fonctionne pareil en dessous : la machinerie décrit ce qui est disponible, le modèle demande à s’en servir, la machinerie exécute et rend compte.`,
   `Les <b>connexions</b> sont le premier type : votre drive, votre agenda, votre courrier, un navigateur. C’est le plus grand gain disponible pour la plupart des gens, et celui qu’on laisse le plus souvent désactivé. Un assistant qui voit le vrai tableur bat un assistant qui travaille sur une copie collée mardi dernier, à chaque fois. Il existe désormais un standard commun pour ces connexions, si bien que la même intégration fonctionne de plus en plus chez Claude comme chez Gemini.`,
   `Les <b>instructions enregistrées pour une tâche récurrente</b> sont le deuxième. Claude les appelle des skills ; les Gems de Gemini font quelque chose d’approchant. Voyez cela comme une fiche recette : écrite une fois, en langage courant, pour ce que vous faites de façon répétée. &laquo;&nbsp;Quand je te donne un cours, produis dix fiches de révision dans ce format, et signale ce qui a l’air tombable à l’examen.&nbsp;&raquo; L’astuce est qu’elles restent en retrait tant qu’elles ne servent pas : vous pouvez en avoir des dizaines sans rien ralentir.`,
   `Les <b>assistants de l’assistant</b> sont le troisième. Pour un travail qui demande de lire beaucoup et de rapporter peu, il peut envoyer une copie de lui-même lire dans sa propre conversation et revenir avec une synthèse. Vous le percevez surtout comme un mode recherche qui disparaît deux minutes et revient avec quelque chose de consistant.`
  ],
  figCaption:"Le modèle ne sait produire que du texte. La machinerie autour transforme ce texte en actions, et la dernière ligne est la seule sur laquelle le modèle n’a pas son mot à dire.",
  dives:[
   {t:"Bien gérer les connexions",
    html:`<p>C’est dans les connexions que se trouvent l’essentiel de la valeur et la totalité du risque : quelques habitudes valent la peine.</p>
    <ul class="bul">
      <li><b>Commencez en lecture seule.</b> Voir votre agenda, c’est l’essentiel du bénéfice ; pouvoir le modifier, c’est l’essentiel du risque.</li>
      <li><b>Connectez une chose à la fois</b> et servez-vous-en une semaine avant d’ajouter la suivante. Vous découvrirez ce à quoi elle sert vraiment, ce qui est rarement ce que vous aviez supposé.</li>
      <li><b>Pointez la source, pas une copie.</b> Tout l’intérêt est qu’il lise le document vivant.</li>
      <li><b>Restreignez le dossier.</b> Si le travail tient dans un dossier, n’accordez qu’un dossier. Ce n’est pas qu’une question de sécurité. Un périmètre étroit empêche aussi l’assistant d’errer dans des fichiers hors sujet et de s’embrouiller.</li>
      <li><b>Gardez les validations pour l’envoi et la suppression</b>, aussi fastidieux soit-ce, tant que vous n’avez pas vu la même tâche réussir plusieurs fois.</li>
    </ul>`},
   {t:"Si vous développez",
    html:`<p>Les noms courants ci-dessus en ont de techniques, et les distinctions comptent dès qu’on construit au lieu d’utiliser.</p>
    <ul class="bul">
      <li><b>MCP</b>, le Model Context Protocol, est le standard commun des connexions. Un service publie un serveur ; tout client conforme peut l’utiliser. Claude, Cowork, Claude Code, Antigravity et Gemini Spark le parlent tous : une intégration écrite une fois fonctionne dans les deux écosystèmes.</li>
      <li>Les <b>skills</b> sont des dossiers contenant un <code>SKILL.md</code> plus des fichiers de référence et des scripts. Elles fonctionnent sur claude.ai, Claude Code, l’Agent SDK et la plateforme développeur ; Antigravity CLI a son équivalent.</li>
      <li>Les <b>sous-agents</b> exécutent leur propre boucle dans leur propre fenêtre de contexte et renvoient une synthèse. C’est le mécanisme derrière les &laquo;&nbsp;assistants de l’assistant&nbsp;&raquo; ci-dessus.</li>
      <li>Les <b>hooks</b> se déclenchent sur un événement de cycle de vie et s’exécutent quoi que décide le modèle. Tout le reste de cette page est une demande ; le hook est la seule garantie.</li>
      <li>Les <b>plugins</b> empaquettent l’ensemble en une unité installable, pour partager une configuration entre dépôts ou au sein d’une équipe.</li>
    </ul>
    <p>L’idée de conception à voler, même sans jamais en écrire une, est la <b>divulgation progressive</b>. Une skill n’expose que son nom et sa description tant que le modèle ne la juge pas pertinente ; le corps se charge alors, et ses fichiers de référence seulement si la tâche y touche. Presque rien ne réside en mémoire : la quantité d’expertise attachable est donc pratiquement illimitée. Vous pouvez appliquer le principe à la main : réduisez vos instructions permanentes à un index court de ce qui existe et où, et laissez l’assistant lire le détail au besoin. Pour un bloc d’instructions de projet devenu obèse, c’est la modification la plus rentable.</p>`}
  ],
  callout:`<b>Connectez quelque chose cette semaine.</b> La plupart des gens utilisent ces assistants à une fraction de leur utilité, parce qu’ils ne voient aucun de leurs vrais documents. Un dossier, en lecture seule, suffit à sentir la différence.`
 }
},
/* ─────────────────────── 07 CLAUDE ─────────────────────── */
{
 id:"claude", num:"08", scene:"cards", color:"var(--a7)",
 en:{
  title:"The Claude side",
  dek:"One family of models behind four rather different front doors, and since September 2026 you no longer have to choose between the first two.",
  body:[
   `On 16 September 2026 Anthropic folded its agent product, Cowork, into the main Claude app. Chat, Cowork and Design became one thing that sends your request to whichever part suits it, instead of asking you to pick a tab first. Claude Slides and Claude Docs arrived at the same time. Claude Code, which is for programmers, stayed separate.`,
   `What this means in practice is that you no longer decide between &ldquo;chatting&rdquo; and &ldquo;setting an agent loose&rdquo;. You decide how much access and how much independence to grant, and the product works out the rest. What is still worth knowing is what sits behind each door.`
  ],
  cards:[
   {n:"Claude",s:"Conversation · web, desktop, phone",c:"var(--a7)",
    p:"The thinking-and-writing surface. Fast, nothing happens to your files, nothing to undo. Projects give it standing instructions and a memory of their own.",
    li:["Best for: working something out, drafting, explaining, one-off analysis","Artifacts, Slides and Docs for things you want to keep or share","Since September 2026 it steps up into Cowork by itself when the job needs your files"]},
   {n:"Cowork",s:"Doing the work · desktop, web and phone in beta",c:"var(--a6)",
    p:"Give it a goal rather than a message. It works through the folders and accounts you have allowed, shows each step, and asks before anything significant.",
    li:["Reads, edits and creates files in folders you choose","Connects to Drive, Slack, Microsoft 365 and others","Can run to a schedule, and keeps going while your laptop is shut","Has its own browser, kept apart from yours","You can watch and redirect it from your phone"]},
   {n:"Claude Code",s:"For writing software · terminal, editor",c:"var(--a2)",
    p:"Built around a code repository, for people who write software. The most capable of the four, and the one that expects the most setup.",
    li:["A file of project conventions it reads every session","Saved workflows, helper agents, enforced rules","Connections, a sandbox, and the ability to undo","Not only for code, but it assumes you have a repository"]},
   {n:"Build your own",s:"Agent SDK and API",c:"var(--a3)",
    p:"The same machinery Claude Code runs on, published as a library. For when the tool you want does not exist yet.",
    li:["Your own tools, your own permission rules","Where developers go once the apps stop fitting","Not something you need unless you are writing software"]}
  ],
  figCaption:"Four ways in. Independence and access increase from left to right; so does how much setting up you have to do yourself.",
  dives:[
   {t:"Which one, for what",
    html:`<p>The official line is that Claude Code does software and Cowork does everything else. True, but there is a sharper way to choose: <b>ask where the work ends up.</b></p>
    <p>If it ends in a <b>decision or an explanation</b>, stay in the conversation. If it ends in a <b>document, a spreadsheet, a tidied folder or a message sent</b>, that is Cowork. If it ends in <b>code committed to a repository</b>, that is Claude Code.</p>
    <p>And if you are not sure, start in the conversation. It is the cheapest place to find out what you actually want, and since September the app will escalate on its own when the job outgrows it.</p>`},
   {t:"Getting good results from Cowork",
    html:`<ul class="bul">
      <li><b>Choose the smallest folder that contains the job.</b> Access is the main thing you control, and a narrow folder also keeps it from wandering.</li>
      <li><b>Give it a finish line.</b> &ldquo;Go through these two bank exports and list every payment that appears in one and not the other, with the date and amount&rdquo; works. &ldquo;Have a look at these files&rdquo; does not.</li>
      <li><b>Keep approvals on for anything that sends or deletes</b> until you have watched that exact task succeed a few times. Then relax it for that task, not for everything.</li>
      <li><b>Schedule the things you would otherwise forget</b>, and read the first three runs properly. An unattended assistant repeats a misunderstanding rather than noticing it.</li>
      <li><b>Let it read the real file.</b> A connection to the live spreadsheet beats a copy that was correct last week.</li>
    </ul>`}
  ],
  callout:`<b>Independence is a dial, not a product.</b> The same job can be a conversation you steer sentence by sentence, an assistant you approve step by step, or something scheduled that you only read the output of. Start at the left and move right once you have seen it work.`
 },
 fr:{
  title:"Le côté Claude",
  dek:"Une même famille de modèles derrière quatre portes assez différentes, et depuis septembre 2026 il n’y a plus besoin de choisir entre les deux premières.",
  body:[
   `Le 16 septembre 2026, Anthropic a intégré son produit agent, Cowork, dans l’application Claude principale. Chat, Cowork et Design sont devenus une seule chose qui oriente votre demande vers la partie qui convient, au lieu de vous faire choisir un onglet d’abord. Claude Slides et Claude Docs sont arrivés en même temps. Claude Code, destiné aux programmeurs, est resté à part.`,
   `Concrètement, vous ne choisissez plus entre &laquo;&nbsp;discuter&nbsp;&raquo; et &laquo;&nbsp;lâcher un agent&nbsp;&raquo;. Vous choisissez quel accès et quelle indépendance accorder, et le produit se débrouille du reste. Ce qui reste utile à savoir, c’est ce qu’il y a derrière chaque porte.`
  ],
  cards:[
   {n:"Claude",s:"Conversation · web, bureau, téléphone",c:"var(--a7)",
    p:"La surface où l’on réfléchit et où l’on écrit. Rapide, rien n’arrive à vos fichiers, rien à défaire. Les Projets lui donnent des instructions permanentes et une mémoire propre.",
    li:["Idéal pour : démêler une question, rédiger, expliquer, analyser ponctuellement","Artifacts, Slides et Docs pour ce que vous voulez garder ou partager","Depuis septembre 2026, il bascule tout seul vers Cowork quand la tâche exige vos fichiers"]},
   {n:"Cowork",s:"Faire le travail · bureau, web et téléphone en bêta",c:"var(--a6)",
    p:"Donnez-lui un objectif plutôt qu’un message. Il travaille dans les dossiers et comptes que vous avez autorisés, montre chaque étape, et demande avant toute action notable.",
    li:["Lit, modifie et crée des fichiers dans les dossiers que vous choisissez","Se connecte à Drive, Slack, Microsoft 365 et d’autres","Peut tourner à heure fixe, et continue portable fermé","A son propre navigateur, séparé du vôtre","Vous pouvez le suivre et le réorienter depuis votre téléphone"]},
   {n:"Claude Code",s:"Pour écrire du logiciel · terminal, éditeur",c:"var(--a2)",
    p:"Construit autour d’un dépôt de code, pour ceux qui programment. Le plus capable des quatre, et celui qui demande le plus de configuration.",
    li:["Un fichier de conventions qu’il relit à chaque session","Procédures enregistrées, agents auxiliaires, règles imposées","Connexions, bac à sable, possibilité de revenir en arrière","Pas réservé au code, mais il suppose que vous avez un dépôt"]},
   {n:"Construire le vôtre",s:"Agent SDK et API",c:"var(--a3)",
    p:"La machinerie même de Claude Code, publiée en bibliothèque. Pour quand l’outil que vous voulez n’existe pas encore.",
    li:["Vos propres outils, vos propres règles de permission","Là où vont les développeurs quand les applications ne suffisent plus","Inutile si vous ne programmez pas"]}
  ],
  figCaption:"Quatre entrées. L’indépendance et l’accès augmentent de gauche à droite ; la configuration à faire soi-même aussi.",
  dives:[
   {t:"Laquelle, pour quoi",
    html:`<p>La ligne officielle veut que Claude Code fasse le logiciel et Cowork tout le reste. C’est vrai, mais il existe un critère plus net : <b>demandez-vous où finit le travail.</b></p>
    <p>S’il finit en <b>décision ou en explication</b>, restez dans la conversation. S’il finit en <b>document, tableur, dossier rangé ou message envoyé</b>, c’est Cowork. S’il finit en <b>code déposé dans un dépôt</b>, c’est Claude Code.</p>
    <p>Et dans le doute, commencez par la conversation. C’est l’endroit le moins cher pour découvrir ce que vous voulez vraiment, et depuis septembre l’application monte d’elle-même en puissance quand la tâche la dépasse.</p>`},
   {t:"Tirer quelque chose de bon de Cowork",
    html:`<ul class="bul">
      <li><b>Choisissez le plus petit dossier qui contient le travail.</b> L’accès est la variable principale que vous maîtrisez, et un périmètre étroit l’empêche d’errer.</li>
      <li><b>Donnez-lui une ligne d’arrivée.</b> &laquo;&nbsp;Passe ces deux relevés et liste chaque paiement qui figure dans l’un et pas dans l’autre, avec la date et le montant&nbsp;&raquo; fonctionne. &laquo;&nbsp;Jette un œil à ces fichiers&nbsp;&raquo; non.</li>
      <li><b>Gardez les validations pour ce qui envoie ou supprime</b> tant que vous n’avez pas vu cette tâche précise réussir plusieurs fois. Puis assouplissez pour elle, pas pour tout.</li>
      <li><b>Programmez ce que vous oublieriez</b>, et lisez sérieusement les trois premières exécutions. Un assistant non surveillé répète un malentendu au lieu de le remarquer.</li>
      <li><b>Laissez-le lire le vrai fichier.</b> Une connexion au tableur vivant vaut mieux qu’une copie exacte la semaine dernière.</li>
    </ul>`}
  ],
  callout:`<b>L’indépendance est un curseur, pas un produit.</b> Le même travail peut être une conversation pilotée phrase par phrase, un assistant validé étape par étape, ou une tâche programmée dont vous lisez seulement le résultat. Commencez à gauche, avancez quand vous avez vu que ça marche.`
 }
},
/* ─────────────────────── 08 GEMINI ─────────────────────── */
{
 id:"gemini", num:"09", scene:"cards", color:"var(--a2)",
 en:{
  title:"The Gemini side",
  dek:"Google's bet is different: the assistant lives in the cloud, inside the accounts you already have, and you reach it the way you reach a colleague.",
  body:[
   `Google announced <b>Gemini Spark</b> in May 2026: a personal assistant that runs around the clock on Google's servers rather than on your device, so it carries on working when you shut the laptop. It is wired deeply into Gmail, Docs and the rest of Workspace, and browses through Chrome. On Android, a feature called Halo shows you what it is doing. It needs the AI Ultra subscription, at $100 a month, US-only when it launched.`,
   `The detail worth noticing is the way you talk to it: <b>Spark has its own email address.</b> You email your assistant, and it emails you back. That is a genuinely different relationship from a chat window, and it makes handing something over feel like handing something over.`,
   `For most people, though, the everyday Gemini app is the thing, and it has four features worth learning properly rather than four hundred worth skimming: Gems, Deep Research, Canvas, and the memory described earlier.`,
   `One last thing, because the version numbers mislead. Google's <b>Flash</b> line has moved fast: 3.5 in May, 3.6 in July, 3.7 in August, 3.8 in September. The <b>Pro</b> flagship has not moved since February: Gemini 3.1 Pro is still a preview, and the promised 3.5 Pro never shipped. So when someone says &ldquo;Gemini 3.7&rdquo;, they mean Flash. There is no Pro at that number.`
  ],
  cards:[
   {n:"Gemini app",s:"Conversation · web, phone, Workspace",c:"var(--a2)",
    p:"The everyday surface, and the one most people should actually invest an hour in.",
    li:["Gems: a saved assistant with a role, a job, background and a format, plus up to ten reference files","Deep Research: goes away and reads hundreds of sources, then comes back with something cited","Canvas: edit a document side by side instead of regenerating the whole thing","Remembers across conversations on personal accounts; Temporary Chat when you would rather it did not"]},
   {n:"Gemini Spark",s:"Always-on assistant · AI Ultra",c:"var(--a1)",
    p:"An assistant with an inbox. Runs on Google's servers day and night, acts inside your Google account, and reports back.",
    li:["Email it at its own address; it can watch yours","Recurring jobs, and behaviours you teach it once","Permissions start switched off; you grant each app deliberately","Connects to outside services like Canva and OpenTable","Halo on Android shows progress as it works"]},
   {n:"Antigravity",s:"For writing software · desktop",c:"var(--a4)",
    p:"Google's programming environment, built around agents rather than autocomplete. One view for working with a single agent, another for running several at once.",
    li:["Agents hand back plans, task lists and recordings you can check","Uses the editor, the terminal and a built-in browser","Runs Gemini 3.8 Flash and 3.1 Pro, and also Claude"]},
   {n:"Antigravity CLI",s:"Terminal and library",c:"var(--a5)",
    p:"The same agents from a terminal, plus a library for building your own. Of interest mainly if you write software.",
    li:["Replaced Gemini CLI in June 2026","Agents run in the background without blocking you","Saved instructions, enforced rules, helper agents, plugins"]}
  ],
  figCaption:"Four ways in. Notice how much is assumed rather than configured. With a Google account, the connections are already there.",
  dives:[
   {t:"Reading the Gemini version numbers",
    html:`<p>The release cadence tells you where Google's effort is going, and it is not where the branding suggests.</p>
    <ul class="bul">
      <li><b>Flash, 2026:</b> 3.5 in May, 3.6 and a cheaper Flash-Lite in July, 3.7 in August at half the previous price, 3.8 in September, all pitched at long-running work and agents. Gemini 3.8 Live arrived the same month for voice.</li>
      <li><b>Pro:</b> last substantive update February 2026. Gemini 3.1 Pro is still labelled a preview, and the 3.5 Pro that was promised has never appeared. Bloomberg reported it was struggling to meet internal targets; Google has stayed vague while training Gemini 4, and may skip 3.5 Pro entirely.</li>
    </ul>
    <p>Two things follow. The cheaper everyday tier is now where new capability lands first, so judging Google on its flagship understates what its products actually run on. And a version number alone is ambiguous, so always say which line you mean.</p>
    <p>One release worth knowing if you work in security: <b>Gemini 3.5 Flash Cyber</b>, tuned for finding and fixing vulnerabilities, shipped in July 2026 to governments and trusted partners only, as a limited pilot. It is not generally available.</p>`},
   {t:"Getting good results from the Gemini app",
    html:`<ul class="bul">
      <li><b>Build a Gem instead of repeating yourself.</b> Its four fields, role and job and background and format, are a good structure for any request, and the files you attach become permanent context. This is the closest thing Gemini has to a project.</li>
      <li><b>Use Deep Research for breadth, not for judgement.</b> It will read hundreds of sources and cite them. Deciding which ones to believe is still your job, especially where they disagree.</li>
      <li><b>Switch to Canvas the moment you are editing rather than generating.</b> Selecting a paragraph and asking for a change is faster, cheaper and far more predictable than regenerating the document and hoping the good bits survive.</li>
      <li><b>Remember that Gems do not use your memory.</b> A Gem needs its context written into it explicitly.</li>
      <li><b>Check what influenced an answer</b> with the previous-chats marker, whenever a reply seems to know something you did not just tell it.</li>
    </ul>`},
   {t:"Where the two philosophies differ",
    html:`<p><b>Google assumes the account; Anthropic assumes the material.</b> Spark's advantage is that Gmail, Docs, Drive and Calendar are already connected with nothing to set up, and it runs whether or not your machine is on. Cowork's advantage is that it works on whatever folders and tools you nominate, including ones Google does not own, and it runs where you can watch it.</p>
    <p><b>Google is building a place to go; Anthropic is building a layer to add.</b> Antigravity is an application you move into. Claude Code runs inside the editor and terminal you already have. Neither is obviously right, and for most people the deciding factor is simply where their documents already live.</p>
    <p><b>Both have converged on the same ideas.</b> Saved instructions, helper agents, enforced rules, a shared connection standard: the vocabulary is now common to both. Learning it once transfers.</p>`}
  ],
  callout:`<b>Grant access the way you would to someone new.</b> Spark starts with everything switched off, which is the right default. Add one connection, watch it work for a while, then add the next, and keep the ability to send and delete until last.`
 },
 fr:{
  title:"Le côté Gemini",
  dek:"Le pari de Google est différent : l’assistant vit dans le cloud, à l’intérieur des comptes que vous avez déjà, et vous le joignez comme un collègue.",
  body:[
   `Google a annoncé <b>Gemini Spark</b> en mai 2026 : un assistant personnel qui tourne en continu sur les serveurs de Google plutôt que sur votre appareil, et continue donc à travailler quand vous fermez le portable. Il est profondément intégré à Gmail, Docs et au reste de Workspace, et navigue via Chrome. Sur Android, une fonction nommée Halo montre ce qu’il est en train de faire. Il exige l’abonnement AI Ultra, à 100&nbsp;$ par mois, réservé aux États-Unis au lancement.`,
   `Le détail à remarquer est la façon dont on lui parle : <b>Spark a sa propre adresse e-mail.</b> Vous écrivez à votre assistant, il vous répond. C’est une relation réellement différente d’une fenêtre de chat, et déléguer y ressemble enfin à déléguer.`,
   `Pour la plupart des gens, cela dit, c’est l’application Gemini quotidienne qui compte, et elle a quatre fonctions qu’il vaut mieux apprendre sérieusement plutôt que quatre cents à survoler : Gems, Deep Research, Canvas, et la mémoire décrite plus haut.`,
   `Un dernier point, parce que les numéros de version induisent en erreur. La gamme <b>Flash</b> de Google avance vite : 3.5 en mai, 3.6 en juillet, 3.7 en août, 3.8 en septembre. Le vaisseau amiral <b>Pro</b>, lui, n’a pas bougé depuis février : Gemini 3.1 Pro est toujours en préversion, et le 3.5 Pro promis n’est jamais sorti. Donc quand quelqu’un dit &laquo;&nbsp;Gemini 3.7&nbsp;&raquo;, il parle de Flash. Il n’existe pas de Pro à ce numéro.`
  ],
  cards:[
   {n:"Application Gemini",s:"Conversation · web, téléphone, Workspace",c:"var(--a2)",
    p:"La surface du quotidien, et celle dans laquelle il vaut vraiment la peine d’investir une heure.",
    li:["Gems : un assistant enregistré avec un rôle, une mission, un contexte et un format, plus jusqu’à dix fichiers de référence","Deep Research : part lire des centaines de sources et revient avec un texte sourcé","Canvas : modifier un document côte à côte au lieu de tout régénérer","Se souvient d’une conversation à l’autre sur un compte personnel ; mode Temporaire quand vous préférez que non"]},
   {n:"Gemini Spark",s:"Assistant permanent · AI Ultra",c:"var(--a1)",
    p:"Un assistant avec une boîte mail. Tourne sur les serveurs de Google jour et nuit, agit dans votre compte Google, et vous rend compte.",
    li:["Écrivez-lui à sa propre adresse ; il peut surveiller la vôtre","Tâches récurrentes, et comportements qu’on lui apprend une fois","Les permissions démarrent désactivées ; vous accordez chaque application délibérément","Se connecte à des services extérieurs comme Canva ou OpenTable","Halo, sur Android, montre la progression"]},
   {n:"Antigravity",s:"Pour écrire du logiciel · bureau",c:"var(--a4)",
    p:"L’environnement de programmation de Google, construit autour des agents plutôt que de l’autocomplétion. Une vue pour travailler avec un agent, une autre pour en faire tourner plusieurs.",
    li:["Les agents rendent des plans, des listes de tâches et des enregistrements vérifiables","Utilise l’éditeur, le terminal et un navigateur intégré","Fait tourner Gemini 3.8 Flash et 3.1 Pro, et aussi Claude"]},
   {n:"Antigravity CLI",s:"Terminal et bibliothèque",c:"var(--a5)",
    p:"Les mêmes agents depuis un terminal, plus une bibliothèque pour bâtir les vôtres. Intéressant surtout si vous développez.",
    li:["A remplacé Gemini CLI en juin 2026","Les agents tournent en arrière-plan sans vous bloquer","Instructions enregistrées, règles imposées, agents auxiliaires, plugins"]}
  ],
  figCaption:"Quatre entrées. Notez la part de choses présupposées plutôt que configurées. Avec un compte Google, les connexions sont déjà là.",
  dives:[
   {t:"Lire les numéros de version de Gemini",
    html:`<p>La cadence des sorties indique où va l’effort de Google, et ce n’est pas là où la marque le suggère.</p>
    <ul class="bul">
      <li><b>Flash, 2026 :</b> 3.5 en mai, 3.6 et un Flash-Lite moins cher en juillet, 3.7 en août à moitié prix du précédent, 3.8 en septembre, tous positionnés sur le travail au long cours et les agents. Gemini 3.8 Live est arrivé le même mois pour la voix.</li>
      <li><b>Pro :</b> dernière mise à jour substantielle en février 2026. Gemini 3.1 Pro porte toujours l’étiquette préversion, et le 3.5 Pro promis n’est jamais apparu. Bloomberg a rapporté qu’il peinait à atteindre ses objectifs internes ; Google reste évasif tout en entraînant Gemini 4, et pourrait sauter le 3.5 Pro.</li>
    </ul>
    <p>Deux conséquences. C’est désormais la gamme économique du quotidien qui reçoit les nouveautés en premier : juger Google sur son vaisseau amiral sous-estime ce que ses produits font réellement tourner. Et un numéro de version seul est ambigu, précisez donc toujours la gamme.</p>
    <p>Une sortie à connaître si vous travaillez en sécurité : <b>Gemini 3.5 Flash Cyber</b>, réglé pour détecter et corriger des vulnérabilités, livré en juillet 2026 aux seuls gouvernements et partenaires de confiance, en pilote restreint. Il n’est pas disponible publiquement.</p>`},
   {t:"Tirer quelque chose de bon de l’application Gemini",
    html:`<ul class="bul">
      <li><b>Construisez un Gem au lieu de vous répéter.</b> Ses quatre champs, rôle et mission et contexte et format, forment une bonne structure pour n’importe quelle demande, et les fichiers joints deviennent du contexte permanent. C’est ce qui se rapproche le plus d’un projet chez Gemini.</li>
      <li><b>Utilisez Deep Research pour la largeur, pas pour le jugement.</b> Il lira des centaines de sources et les citera. Décider lesquelles croire reste votre travail, surtout quand elles divergent.</li>
      <li><b>Passez à Canvas dès que vous modifiez au lieu de générer.</b> Sélectionner un paragraphe et demander un changement est plus rapide, moins cher et bien plus prévisible que régénérer le document en espérant que les bons passages survivent.</li>
      <li><b>Rappelez-vous que les Gems n’utilisent pas la mémoire.</b> Un Gem doit contenir son contexte explicitement.</li>
      <li><b>Vérifiez ce qui a influencé une réponse</b> via le repère des conversations précédentes, chaque fois qu’une réponse semble savoir ce que vous ne venez pas de dire.</li>
    </ul>`},
   {t:"Où les deux philosophies divergent",
    html:`<p><b>Google présuppose le compte ; Anthropic présuppose la matière.</b> L’avantage de Spark, c’est que Gmail, Docs, Drive et Agenda sont déjà connectés sans rien à configurer, et qu’il tourne que votre machine soit allumée ou non. L’avantage de Cowork, c’est qu’il travaille sur les dossiers et outils que vous désignez, y compris ceux que Google ne possède pas, et qu’il s’exécute là où vous le voyez.</p>
    <p><b>Google construit un lieu où aller ; Anthropic construit une couche à ajouter.</b> Antigravity est une application dans laquelle on emménage. Claude Code s’exécute dans l’éditeur et le terminal qu’on a déjà. Aucun n’a manifestement raison, et pour la plupart des gens le critère décisif est simplement l’endroit où vivent déjà leurs documents.</p>
    <p><b>Les deux ont convergé sur les mêmes idées.</b> Instructions enregistrées, agents auxiliaires, règles imposées, standard de connexion commun : le vocabulaire est désormais partagé. L’apprendre une fois est transférable.</p>`}
  ],
  callout:`<b>Accordez les accès comme à quelqu’un de nouveau.</b> Spark démarre tout désactivé, ce qui est le bon défaut. Ajoutez une connexion, regardez-la travailler un moment, puis passez à la suivante, en gardant pour la fin le droit d’envoyer et de supprimer.`

/* ─────────────────────── 10 PRACTICE ─────────────────────── */
{
 id:"practice", num:"11", scene:"plays", color:"var(--a1)",
 en:{
  title:"How to actually use it",
  dek:"Seven situations, and the thing that genuinely changes the outcome in each, plus one for the programmers.",
  body:[
   `Clever phrasings go out of date. What lasts is structural: say what you want and who it is for, give the assistant the material rather than a description of the material, and match how much you let it do on its own to how easy the result is to undo.`
  ],
  pc:{badH:"Costs more, works less",goodH:"Costs less, works better",
   bad:"Hi! Can you help me choose between these two quotes? I'll paste them. Actually here's the first one. And we also care a lot about not being locked in for ages. Can you be thorough and make sure you don't miss anything important?",
   good:"Two quotes for the same job are attached.\nWe are a family of four, we plan to stay in this house for at least ten years, and being locked into a long contract matters more to us than saving a little each month.\nGive me a table: what each one includes, what each one leaves out, total cost over five years, and how easily we could leave.\nThen tell me which you would choose and what would change your mind.\nIf something isn't stated in the quotes, say so rather than assuming."},
  plays:[
   {t:"Getting an answer you can trust",
    html:`<ol>
      <li><b>Say what you want in the first sentence.</b> Everything after that is context for it. Assistants are bad at guessing which part of a long message was the actual question.</li>
      <li><b>Say what the answer should look like</b>: a table, three bullet points, one paragraph, a straight recommendation. It is the cheapest instruction you can give and the one most often left out.</li>
      <li><b>Say who it is for.</b> &ldquo;Explain it to someone who has never done this&rdquo; changes the answer more than any adjective.</li>
      <li><b>Give it permission not to know.</b> Adding &ldquo;if you are not sure, say so&rdquo; measurably reduces confident invention. Nothing else you can type helps this much.</li>
      <li><b>Check one thing you already know.</b> Ten seconds, and it tells you how much to trust the rest.</li>
    </ol>`},
   {t:"Learning and revising",
    html:`<p>This is where these tools are at their most genuinely useful, and where they are most often used badly. The bad way is to ask for a summary and read it. The good way is to make it ask <em>you</em> things.</p>
    <ol>
      <li><b>Ask to be tested, not told.</b> &ldquo;Ask me five questions on this chapter, one at a time, and don't give me the answer until I have tried.&rdquo; Being asked is what makes it stick; being told is not.</li>
      <li><b>Ask for the same idea three ways</b>: a plain explanation, an analogy, and a worked example. If one of them lands, you have understood it; if none do, you have found what to ask your teacher.</li>
      <li><b>Paste your own attempt and ask what is wrong with it</b> rather than asking for the answer. &ldquo;Here is my argument. Where is it weakest?&rdquo;</li>
      <li><b>Ask it to be honest rather than encouraging.</b> Say so explicitly: &ldquo;Don't tell me it's good if it isn't. Tell me the single biggest problem.&rdquo;</li>
      <li><b>Be careful with facts, relaxed with explanation.</b> It is excellent at explaining something you can then verify, and confident about dates, figures and citations that occasionally do not exist. For anything you will be marked on, check the source.</li>
    </ol>`},
   {t:"Writing something that sounds like you",
    html:`<ol>
      <li><b>Give it two things you have written</b> and ask it to work out how you write before it drafts anything. This is far more effective than describing your style.</li>
      <li><b>Agree the outline before the prose.</b> Fixing an outline costs a sentence; fixing a finished letter costs the whole letter.</li>
      <li><b>Never send the first draft.</b> Not because it is bad, but because it is generic, and the thing that makes a letter work is usually the specific detail only you know.</li>
      <li><b>Edit in place rather than regenerating.</b> Ask it to change one paragraph. Asking again from scratch re-rolls the parts you liked.</li>
      <li><b>Say what you want the reader to feel or do.</b> A complaint that wants an apology reads differently from one that wants a refund, and it cannot guess which you are after.</li>
    </ol>`},
   {t:"Comparing options and deciding",
    html:`<ol>
      <li><b>State your constraints before asking.</b> Budget, timeframe, what you will not compromise on. Without them you get a balanced overview of things you cannot use.</li>
      <li><b>Ask for the case against your preference.</b> &ldquo;I am leaning towards the first one. Argue me out of it.&rdquo; These assistants have a strong pull towards agreeing with you, and this is the simplest way to counteract it.</li>
      <li><b>Separate finding from judging.</b> Ask for the facts and sources first, and for a recommendation second. Mixed together, you get confident prose resting on thin evidence.</li>
      <li><b>Ask what would change the answer.</b> &ldquo;What would have to be true for the other option to win?&rdquo; This is more useful than the recommendation itself.</li>
      <li><b>For anything medical, legal or financial, treat it as preparation, not advice.</b> It is genuinely good at explaining what a document means and what questions to ask a professional. That is a real service. It is not the professional.</li>
    </ol>`},
   {t:"Documents, files and admin",
    html:`<p>This is what the agent products are actually for, and the first place most people feel the difference.</p>
    <ol>
      <li><b>Let it read the real files</b> rather than pasting copies. This is the whole point of connecting a folder.</li>
      <li><b>Ask for a plan before it touches anything.</b> &ldquo;Tell me what you intend to do, then wait.&rdquo; Reading a plan takes ten seconds and prevents most of what goes wrong.</li>
      <li><b>Work on copies at first.</b> Have it write results into a new folder rather than changing your originals, until you trust it with that particular job.</li>
      <li><b>Give it a finish line.</b> &ldquo;List every invoice with no matching payment, with date and amount&rdquo; works. &ldquo;Sort out my invoices&rdquo; does not.</li>
      <li><b>Ask it what it skipped.</b> A short note of what it could not do is worth more than a clean summary that quietly left things out.</li>
    </ol>`},
   {t:"Handing over something that repeats",
    html:`<ol>
      <li><b>Do it with it three times first.</b> If you cannot predict what it will do, it is not ready to do it without you.</li>
      <li><b>Define finished, and define stop.</b> A scheduled assistant with no stopping condition is an expensive way to discover it needed one.</li>
      <li><b>Grant the least access that works</b>, read-only wherever possible. This is the whole of the safety story and you only set it once.</li>
      <li><b>Keep approval on for sending, paying and deleting</b> even when it is inconvenient, and especially for scheduled runs, where nobody is watching the step you would have stopped.</li>
      <li><b>Make it report, not just act.</b> A short log of what it did and what it skipped is something you can check. Silent success is not.</li>
      <li><b>Review it every few months.</b> The circumstances it was set up for will have moved.</li>
    </ol>`},
   {t:"Things not to do",
    html:`<div class="row">
     <div><h5>The eternal conversation</h5><p>A six-week thread is not accumulated understanding. It is a long, expensive message that gets less accurate as it grows.</p></div>
     <div><h5>Correcting instead of configuring</h5><p>Saying it again in chat, rather than writing it once where it loads every time.</p></div>
     <div><h5>Pasting everything</h5><p>Adding material in case it helps. Irrelevant text measurably hurts, starting from the first paragraph.</p></div>
     <div><h5>Politeness as instruction</h5><p>&ldquo;Be thorough and accurate&rdquo; asks for nothing. &ldquo;Tell me which parts you are unsure about&rdquo; asks for something.</p></div>
     <div><h5>Trusting a confident tone</h5><p>These systems sound equally certain when they know and when they are guessing. The tone carries no information.</p></div>
     <div><h5>Access before trust</h5><p>Letting something send or delete on your behalf before you have watched it do the job correctly.</p></div>
    </div>`},
   {t:"If you write software",
    html:`<ol>
      <li><b>Write the conventions file on day one</b>: build command, test command, house style, what never to touch. Keep it short; move reference material into saved workflows that load on demand.</li>
      <li><b>Ask for a plan before a diff</b> on anything non-trivial, and actually read it. Correcting a plan is the cheapest intervention available.</li>
      <li><b>Give it a way to check itself.</b> An agent with a test command and a linter converges. One without them produces plausible code.</li>
      <li><b>Put hard rules where they are enforced, not where they are requested.</b> &ldquo;Never touch the migrations directory&rdquo; in a markdown file is a hope; a hook that blocks the write is a rule.</li>
      <li><b>Use helper agents for wide reads</b> such as audits, searches, or mapping an unfamiliar codebase, so the main conversation stays clean.</li>
      <li><b>Review the diff, not the transcript.</b> The conversation is not the deliverable.</li>
    </ol>`}
  ]
 },
 fr:{
  title:"Comment s’en servir vraiment",
  dek:"Sept situations, et ce qui change réellement le résultat dans chacune, plus une pour les programmeurs.",
  body:[
   `Les formulations astucieuses se périment. Ce qui dure est structurel : dites ce que vous voulez et pour qui, donnez à l’assistant la matière plutôt qu’une description de la matière, et ajustez ce que vous le laissez faire seul à la facilité avec laquelle le résultat se défait.`
  ],
  pc:{badH:"Coûte plus, marche moins",goodH:"Coûte moins, marche mieux",
   bad:"Bonjour ! Tu peux m’aider à choisir entre ces deux devis ? Je te les colle. Tiens, voilà le premier. Et on tient beaucoup à ne pas être engagés pendant des années. Tu peux être exhaustif et bien vérifier que tu n’oublies rien d’important ?",
   good:"Deux devis pour le même travail sont joints.\nNous sommes une famille de quatre, nous comptons rester au moins dix ans dans cette maison, et ne pas être engagés sur un long contrat compte plus pour nous qu’économiser un peu chaque mois.\nDonne-moi un tableau : ce que chacun inclut, ce que chacun laisse de côté, le coût total sur cinq ans, et la facilité à en sortir.\nDis-moi ensuite lequel tu choisirais et ce qui te ferait changer d’avis.\nSi une information n’est pas dans les devis, dis-le au lieu de la supposer."},
  plays:[
   {t:"Obtenir une réponse à laquelle se fier",
    html:`<ol>
      <li><b>Dites ce que vous voulez dès la première phrase.</b> Tout le reste n’est que contexte. Les assistants devinent mal quelle partie d’un long message était la vraie question.</li>
      <li><b>Dites à quoi doit ressembler la réponse</b> : un tableau, trois puces, un paragraphe, une recommandation franche. C’est l’instruction la moins chère à donner et la plus souvent oubliée.</li>
      <li><b>Dites pour qui.</b> &laquo;&nbsp;Explique-le à quelqu’un qui n’a jamais fait ça&nbsp;&raquo; change la réponse plus que n’importe quel adjectif.</li>
      <li><b>Autorisez-le à ne pas savoir.</b> Ajouter &laquo;&nbsp;si tu n’es pas sûr, dis-le&nbsp;&raquo; réduit mesurablement l’invention assurée. Rien d’autre que vous puissiez taper n’aide autant.</li>
      <li><b>Vérifiez un point que vous connaissez déjà.</b> Dix secondes, et vous savez quelle confiance accorder au reste.</li>
    </ol>`},
   {t:"Apprendre et réviser",
    html:`<p>C’est là que ces outils sont le plus réellement utiles, et le plus souvent mal employés. La mauvaise façon : demander un résumé et le lire. La bonne : le faire vous interroger, <em>vous</em>.</p>
    <ol>
      <li><b>Demandez à être interrogé, pas informé.</b> &laquo;&nbsp;Pose-moi cinq questions sur ce chapitre, une par une, et ne me donne pas la réponse avant que j’aie essayé.&nbsp;&raquo; C’est d’être interrogé qui fait tenir, pas d’être informé.</li>
      <li><b>Demandez la même idée de trois façons</b> : une explication simple, une analogie, un exemple travaillé. Si l’une passe, vous avez compris ; si aucune ne passe, vous avez trouvé quoi demander à votre professeur.</li>
      <li><b>Collez votre propre tentative et demandez ce qui cloche</b> plutôt que la réponse. &laquo;&nbsp;Voici mon raisonnement. Où est-il le plus faible&nbsp;?&nbsp;&raquo;</li>
      <li><b>Demandez-lui d’être honnête plutôt qu’encourageant.</b> Dites-le explicitement : &laquo;&nbsp;Ne me dis pas que c’est bien si ça ne l’est pas. Dis-moi le plus gros problème.&nbsp;&raquo;</li>
      <li><b>Prudent sur les faits, détendu sur les explications.</b> Il excelle à expliquer une chose que vous pourrez ensuite vérifier, et il est assuré sur des dates, des chiffres et des références qui parfois n’existent pas. Pour tout ce qui sera noté, vérifiez la source.</li>
    </ol>`},
   {t:"Écrire quelque chose qui vous ressemble",
    html:`<ol>
      <li><b>Donnez-lui deux textes de vous</b> et demandez-lui d’en dégager votre façon d’écrire avant de rédiger quoi que ce soit. Bien plus efficace que décrire votre style.</li>
      <li><b>Validez le plan avant la prose.</b> Corriger un plan coûte une phrase ; corriger une lettre finie coûte la lettre entière.</li>
      <li><b>N’envoyez jamais le premier jet.</b> Non parce qu’il est mauvais, mais parce qu’il est générique, et ce qui fait qu’une lettre fonctionne, c’est le détail précis que vous seul connaissez.</li>
      <li><b>Modifiez sur place plutôt que de régénérer.</b> Demandez de changer un paragraphe. Tout relancer relance aussi les passages que vous aimiez.</li>
      <li><b>Dites ce que le lecteur doit ressentir ou faire.</b> Une réclamation qui veut des excuses ne s’écrit pas comme une qui veut un remboursement, et il ne peut pas deviner laquelle vous visez.</li>
    </ol>`},
   {t:"Comparer des options et décider",
    html:`<ol>
      <li><b>Énoncez vos contraintes avant de demander.</b> Budget, délai, ce sur quoi vous ne transigerez pas. Sans cela, vous obtenez un panorama équilibré de choses inutilisables.</li>
      <li><b>Demandez le contre de votre préférence.</b> &laquo;&nbsp;Je penche pour le premier. Dissuade-moi.&nbsp;&raquo; Ces assistants ont une forte tendance à vous donner raison, et c’est la façon la plus simple de la contrer.</li>
      <li><b>Séparez trouver de juger.</b> Demandez d’abord les faits et les sources, la recommandation ensuite. Mélangés, vous obtenez de la prose assurée posée sur des preuves minces.</li>
      <li><b>Demandez ce qui changerait la réponse.</b> &laquo;&nbsp;Que faudrait-il pour que l’autre option l’emporte&nbsp;?&nbsp;&raquo; C’est plus utile que la recommandation elle-même.</li>
      <li><b>Pour le médical, le juridique et le financier, traitez cela comme une préparation, pas un conseil.</b> Il est réellement bon pour expliquer ce que dit un document et quelles questions poser à un professionnel. C’est un vrai service. Ce n’est pas le professionnel.</li>
    </ol>`},
   {t:"Documents, fichiers et administratif",
    html:`<p>C’est précisément à cela que servent les produits agents, et le premier endroit où l’on sent la différence.</p>
    <ol>
      <li><b>Laissez-le lire les vrais fichiers</b> au lieu de coller des copies. C’est tout l’intérêt de connecter un dossier.</li>
      <li><b>Demandez un plan avant qu’il ne touche à quoi que ce soit.</b> &laquo;&nbsp;Dis-moi ce que tu comptes faire, puis attends.&nbsp;&raquo; Lire un plan prend dix secondes et évite l’essentiel des dégâts.</li>
      <li><b>Travaillez d’abord sur des copies.</b> Faites-lui écrire les résultats dans un nouveau dossier plutôt que modifier vos originaux, tant que vous ne lui faites pas confiance sur cette tâche précise.</li>
      <li><b>Donnez-lui une ligne d’arrivée.</b> &laquo;&nbsp;Liste chaque facture sans paiement correspondant, avec la date et le montant&nbsp;&raquo; fonctionne. &laquo;&nbsp;Range mes factures&nbsp;&raquo; non.</li>
      <li><b>Demandez-lui ce qu’il a laissé de côté.</b> Une note brève de ce qu’il n’a pas pu faire vaut mieux qu’un résumé impeccable qui a discrètement sauté des choses.</li>
    </ol>`},
   {t:"Confier quelque chose qui revient",
    html:`<ol>
      <li><b>Faites-le avec lui trois fois d’abord.</b> Si vous ne pouvez pas prédire ce qu’il fera, il n’est pas prêt à le faire sans vous.</li>
      <li><b>Définissez terminé, et définissez arrêter.</b> Un assistant programmé sans condition d’arrêt est une façon coûteuse de découvrir qu’il en fallait une.</li>
      <li><b>Accordez le moins d’accès possible</b>, en lecture seule quand ça suffit. C’est toute l’histoire de la sécurité, et cela se règle une seule fois.</li>
      <li><b>Gardez la validation pour l’envoi, le paiement et la suppression</b>, même quand c’est pénible, et surtout pour les exécutions programmées, où personne ne voit passer l’étape que vous auriez arrêtée.</li>
      <li><b>Faites-lui rendre compte, pas seulement agir.</b> Un court journal de ce qu’il a fait et écarté est vérifiable. Une réussite silencieuse ne l’est pas.</li>
      <li><b>Repassez dessus tous les quelques mois.</b> Les circonstances pour lesquelles il a été réglé auront bougé.</li>
    </ol>`},
   {t:"Ce qu’il ne faut pas faire",
    html:`<div class="row">
     <div><h5>La conversation éternelle</h5><p>Un fil de six semaines n’est pas de la compréhension accumulée. C’est un long message coûteux, de moins en moins juste à mesure qu’il grossit.</p></div>
     <div><h5>Corriger au lieu de configurer</h5><p>Le redire en conversation, plutôt que l’écrire une fois là où c’est chargé à chaque message.</p></div>
     <div><h5>Tout coller</h5><p>Ajouter de la matière au cas où. Le texte hors sujet nuit de façon mesurable, dès le premier paragraphe.</p></div>
     <div><h5>La politesse comme consigne</h5><p>&laquo;&nbsp;Sois exhaustif et exact&nbsp;&raquo; ne demande rien. &laquo;&nbsp;Dis-moi sur quels points tu n’es pas sûr&nbsp;&raquo; demande quelque chose.</p></div>
     <div><h5>Se fier au ton assuré</h5><p>Ces systèmes ont exactement le même aplomb quand ils savent et quand ils devinent. Le ton ne porte aucune information.</p></div>
     <div><h5>L’accès avant la confiance</h5><p>Le laisser envoyer ou supprimer en votre nom avant de l’avoir vu faire le travail correctement.</p></div>
    </div>`},
   {t:"Si vous écrivez du logiciel",
    html:`<ol>
      <li><b>Écrivez le fichier de conventions dès le premier jour</b> : commande de build, commande de test, style maison, ce qu’il ne faut jamais toucher. Gardez-le court ; déplacez la documentation dans des procédures chargées à la demande.</li>
      <li><b>Demandez un plan avant un diff</b> sur tout ce qui n’est pas trivial, et lisez-le vraiment. Corriger un plan est l’intervention la moins chère qui soit.</li>
      <li><b>Donnez-lui de quoi se vérifier.</b> Un agent doté d’une commande de test et d’un linter converge. Sans eux, il produit du code plausible.</li>
      <li><b>Mettez les règles dures là où elles sont imposées, pas là où elles sont demandées.</b> &laquo;&nbsp;Ne touche jamais au répertoire des migrations&nbsp;&raquo; dans un markdown est un espoir ; un hook qui bloque l’écriture est une règle.</li>
      <li><b>Utilisez des agents auxiliaires pour les lectures larges</b>, comme les audits, les recherches ou la cartographie d’une base inconnue, pour garder la conversation principale propre.</li>
      <li><b>Relisez le diff, pas la transcription.</b> La conversation n’est pas le livrable.</li>

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const n = $('#toast'); n.textContent = msg; n.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(()=>n.classList.remove('on'), 3200);
}

/* ---------- share ---------- */
function linkFor(id){
  return location.origin + location.pathname + '?lang=' + LANG + '#' + id;
}
function share(id){
  const url = linkFor(id);
  history.replaceState(null,'','?lang='+LANG+'#'+id);
  const ok = ()=> toast(UI[LANG].copied);
  const fail = ()=> toast(UI[LANG].copyFail + url);
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(ok, fail);
    } else {
      const i = el('textarea'); i.value = url; i.style.position='fixed'; i.style.opacity='0';
      document.body.appendChild(i); i.select();
      const done = document.execCommand('copy'); document.body.removeChild(i);
      done ? ok() : fail();
    }
  }catch(e){ fail(); }
}

function figTokens(c, lang){
  const wrap = el('div','panel');
  const lab = el('div','',''); lab.style.cssText='font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:.5rem';
  lab.textContent = c.demoLabel;
  const ta = el('textarea','tokfield'); ta.id='tokInput'; ta.value = c.demoDefault; ta.setAttribute('aria-label', c.demoLabel);
  const row = el('div','tokrow');
  const stats = el('div','tokstats');
  const keys = ['chars','tokens','ratio','cost'];
  const vals = {};
  keys.forEach(k=>{
    const s = el('div','stat');
    const v = el('span','v','0'); const l = el('span','l', c.stats[k] + (k==='cost'?' × 1000':''));
    s.append(v,l); stats.append(s); vals[k]=v;
  });
  function tokenize(text){
    const out=[]; let pend='';
    const chunks = text.match(/\s+|[A-Za-zÀ-ÖØ-öø-ÿ']+|\d+|[^\sA-Za-zÀ-ÖØ-öø-ÿ'\d]/g) || [];
    for(const ch of chunks){
      if(/^\s+$/.test(ch)){ pend = ch.replace(/\n/g,' '); continue; }
      let pieces;
      if(/^\d+$/.test(ch)) pieces = ch.match(/.{1,3}/g);
      else if(/[À-ÖØ-öø-ÿ]/.test(ch)) pieces = ch.match(/.{1,3}/g);
      else if(ch.length<=5) pieces=[ch];
      else pieces = ch.match(/.{1,4}/g);
      pieces.forEach((p,i)=> out.push({t:(i===0?pend:'')+p, whole:pieces.length===1}));
      pend='';
    }
    return out;
  }
  function update(){
    const text = ta.value;
    const toks = tokenize(text);
    row.textContent='';
    toks.slice(0,260).forEach((t,i)=>{
      const s = el('span','tok');
      s.textContent = t.t.replace(/ /g,'·');
      s.style.background = t.whole ? 'var(--surface-2)' : 'var(--accent-bg)';
      s.style.color = 'var(--ink)';
      s.style.borderBottom = t.whole ? '2px solid transparent' : '2px solid var(--accent)';
      row.append(s);
    });
    if(toks.length>260){ const more = el('span','tok'); more.textContent='+'+(toks.length-260); more.style.color='var(--ink-3)'; row.append(more); }
    vals.chars.textContent = text.length.toLocaleString(lang);
    vals.tokens.textContent = toks.length.toLocaleString(lang);
    vals.ratio.textContent = toks.length ? (text.length/toks.length).toFixed(2) : '0';
    vals.cost.textContent = '$' + (toks.length*0.005).toFixed(3);
  }
  ta.addEventListener('input', update);
  wrap.append(lab, ta, row, stats);
  setTimeout(update,0);
  return {node:wrap};
}

function figCache(c, lang){
  const t = c.calc;
  const wrap = el('div','panel');
  const IN = 5, WRITE = 6.25, READ = 0.5;   // Claude Opus 5, $ per million tokens
  const bar = el('div','cachebar');
  const reused = el('span'), fresh = el('span');
  reused.style.cssText = 'background:var(--a4); color:var(--accent-ink); flex:0 0 88%';
  fresh.style.cssText  = 'background:var(--a1); color:var(--accent-ink); flex:1 1 12%';
  reused.textContent = lang==='fr' ? 'REUTILISE' : 'REUSED';
  fresh.textContent  = lang==='fr' ? 'NEUF' : 'NEW';
  bar.append(reused, fresh);

  const row = el('div','calcrow');
  function field(id,label,val,min,max){
    const f = el('div','calcfield');
    const l = el('label',''); l.textContent = label; l.setAttribute('for', id);
    const i = el('input'); i.type='number'; i.id=id; i.value=val; i.min=min; i.max=max; i.step=(max>1000?1000:1);
    f.append(l,i); return {node:f, input:i};
  }
  const docF   = field('cacheDoc', t.docLabel, 50000, 1000, 500000);
  const turnsF = field('cacheTurns', t.turnsLabel, 10, 1, 100);
  row.append(docF.node, turnsF.node);

  const out = el('div','calcout');
  const cells = {};
  [['noCache','--a1'],['withCache','--a4'],['saving','--a5']].forEach(([k,hue])=>{
    const d = el('div'); d.style.setProperty('--cc','var('+hue+')');
    const v = el('span','v','0'); const l = el('span','l', t[k]);
    d.append(v,l); out.append(d); cells[k]=v;
  });
  const note = el('div','calcnote'); note.textContent = t.note;

  function money(x){ return '$' + (x<10 ? x.toFixed(2) : Math.round(x).toLocaleString(lang)); }
  function update(){
    const doc = Math.max(1000, Math.min(500000, +docF.input.value || 1000));
    const q   = Math.max(1, Math.min(100, +turnsF.input.value || 1));
    const plain  = q * doc * IN / 1e6;
    const cached = doc * WRITE / 1e6 + (q-1) * doc * READ / 1e6;
    cells.noCache.textContent   = money(plain);
    cells.withCache.textContent = money(cached);
    const pct = plain>0 ? Math.round((1 - cached/plain) * 100) : 0;
    cells.saving.textContent = pct + '%';
    const share = Math.max(4, Math.min(96, 100 * (1 - 1/Math.max(1,q))));
    reused.style.flex = '0 0 ' + share.toFixed(1) + '%';
    fresh.style.flex  = '1 1 ' + (100-share).toFixed(1) + '%';
  }
  [docF.input, turnsF.input].forEach(i=> i.addEventListener('input', update));
  wrap.append(bar, row, out, note);
  setTimeout(update, 0);
  return {node:wrap};
}

function figLoop(c, lang){
  const wrap = el('div','panel loopwrap');
  const names = LOOP_SHORT[lang];
  const cx=200, cy=158, r=112;
  const pts = names.map((_,i)=>{ const a = (i/5)*Math.PI*2; return [cx + r*Math.sin(a), cy - r*Math.cos(a)]; });
  let svg = '<svg viewBox="0 0 400 320" role="img" aria-label="'+esc(LOOP_CENTRE[lang])+'">';
  svg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--line-2)" stroke-width="1.5" stroke-dasharray="4 6"/>';
  svg += '<text x="'+cx+'" y="'+(cy+4)+'" text-anchor="middle" fill="var(--ink-3)" font-family="var(--mono)" font-size="10.5" letter-spacing="1.2">'+esc(LOOP_CENTRE[lang].toUpperCase())+'</text>';
  svg += '<circle id="loopDot" cx="'+pts[0][0]+'" cy="'+pts[0][1]+'" r="7" fill="var(--accent)"/>';
  svg += '<g class="nodeg">';
  pts.forEach((p,i)=>{
    const w=104,h=38;
    svg += '<g><rect data-n="'+i+'" x="'+(p[0]-w/2)+'" y="'+(p[1]-h/2)+'" width="'+w+'" height="'+h+'" rx="9" fill="var(--surface-2)" stroke="var(--line-2)" stroke-width="1.5"/>'
        +  '<text data-t="'+i+'" x="'+p[0]+'" y="'+(p[1]+4)+'" text-anchor="middle" fill="var(--ink-2)" font-family="var(--mono)" font-size="11.5">'+esc((i+1)+'. '+names[i])+'</text></g>';
  });
  svg += '</g></svg>';
  wrap.innerHTML = svg;
  const dot = $('#loopDot', wrap);
  function update(i){
    pts.forEach((p,k)=>{
      const rect = wrap.querySelector('[data-n="'+k+'"]'); const txt = wrap.querySelector('[data-t="'+k+'"]');
      const on = k===i;
      rect.setAttribute('fill', on ? 'var(--accent-bg)' : 'var(--surface-2)');
      rect.setAttribute('stroke', on ? 'var(--accent)' : 'var(--line-2)');
      rect.setAttribute('stroke-width', on ? '2.5' : '1.5');
      txt.setAttribute('fill', on ? 'var(--ink)' : 'var(--ink-3)');
    });
    const a = ((i+0.55)/5)*Math.PI*2;
    dot.setAttribute('cx', cx + r*Math.sin(a)); dot.setAttribute('cy', cy - r*Math.cos(a));
    dot.style.transition = RM ? 'none' : 'cx .5s cubic-bezier(.22,1,.36,1), cy .5s cubic-bezier(.22,1,.36,1)';
  }
  update(0);
  return {node:wrap, update};
}
