    n.innerHTML = '<h4>'+esc(card.n)+'</h4><div class="sub">'+esc(card.s)+'</div><p>'+esc(card.p)+'</p><ul>'+card.li.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
    grid.append(n);
  });
  return {node:grid};
}

function figMatrix(c){
  const box = el('div');
  const m = c.matrix;
  const panel = el('div','panel'); panel.style.padding='0';
  const sc = el('div','matrix-scroll');
  let h = '<table class="matrix"><thead><tr>'+m.cols.map(x=>'<th scope="col">'+esc(x)+'</th>').join('')+'</tr></thead><tbody>';
  m.rows.forEach(r=>{
    h += '<tr><th scope="row">'+esc(r[0])+'</th>'+r.slice(1).map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>';
  });
  h += '</tbody></table>';
  sc.innerHTML = h; panel.append(sc); box.append(panel);
  /* on a phone a seven-column table is unreadable — same data, one card per product */
  const cards = el('div','mcards');
  const hues = ['--a7','--a6','--a2','--a3','--a2','--a1','--a4'];
  m.cols.slice(1).forEach((col,i)=>{
    const card = el('article','mcard');
    card.style.setProperty('--cc','var('+hues[i%hues.length]+')');
    card.innerHTML = '<h4>'+esc(col)+'</h4><dl>'
      + m.rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[i+1])+'</dd>').join('')
      + '</dl>';
    cards.append(card);
  });
  box.append(cards);
  return {node:box};
}

function figPlays(c){
  const box = el('div');
  const pcw = el('div','pc');
  pcw.innerHTML = '<div class="bad"><div class="h">'+esc(c.pc.badH)+'</div><p>'+esc(c.pc.bad)+'</p></div>'
                + '<div class="good"><div class="h">'+esc(c.pc.goodH)+'</div><p>'+esc(c.pc.good)+'</p></div>';
  box.append(pcw);
  c.plays.forEach((p,i)=>{
    const d = el('details','play');
    d.innerHTML = '<summary><span class="pn">'+String(i+1).padStart(2,'0')+'</span><span class="pt">'+esc(p.t)+'</span><span class="chev">›</span></summary><div class="play-body">'+p.html+'</div>';
    box.append(d);
  });
  return {node:box};
}

const FIGS = {tokens:figTokens, cache:figCache, budget:figBudget, layers:figLayers, loop:figLoop, memory:figMemory, tools:figTools, cards:figCards, matrix:figMatrix, plays:figPlays};
const SCROLL_SCENES = {budget:1, layers:1, loop:1};
const WIDE = {matrix:1, cards:1};

/* ================= RENDER ================= */
let observers = [];
let SCENES = [];
function clearObs(){
  observers.forEach(o=>o.disconnect()); observers = [];
  SCENES.forEach(sc=>{ if(sc.io) sc.io.disconnect(); }); SCENES = [];
}

/* Which slice of the viewport counts as "you are reading this step".
   Side by side, that is the middle of the screen. Stacked on a phone, the figure
   is pinned to the top and the text sits underneath it — so the band has to sit
   under the figure, or a step fades while you are still reading it. */
const stackedMQ = window.matchMedia('(max-width:860px)');
function readingBand(sticky){
  if(!stackedMQ.matches) return '-45% 0px -45% 0px';
  const vh = window.innerHeight;
  const figTop = parseFloat(getComputedStyle(sticky).top) || 0;
  const figBottom = figTop + sticky.getBoundingClientRect().height;
  const bandH = Math.max(90, Math.min(200, vh - figBottom - 40));
  const bandTop = Math.max(0, Math.min(figBottom + 16, vh - bandH - 8));
  return (-Math.round(bandTop))+'px 0px '+(-Math.round(Math.max(0, vh - bandTop - bandH)))+'px 0px';
}
function wireScenes(){
  SCENES.forEach(sc=>{
    if(sc.io) sc.io.disconnect();
    sc.io = new IntersectionObserver(entries=>{
      entries.forEach(e=>{
        if(!e.isIntersecting) return;
        const i = +e.target.dataset.step;
        sc.nodes.forEach((n,k)=> n.classList.toggle('on', k===i));
        if(sc.fig.update) sc.fig.update(i);
      });
    }, {rootMargin: readingBand(sc.sticky), threshold:0});
    sc.nodes.forEach(n=>sc.io.observe(n));
  });
}

function render(){
  const t = UI[LANG];
  document.documentElement.lang = LANG;
  document.title = t.brand;
  $('#brandTxt').textContent = t.brand;
  $('#langEn').setAttribute('aria-pressed', LANG==='en');
  $('#langFr').setAttribute('aria-pressed', LANG==='fr');
  applyTheme();
  clearObs();

  const app = $('#app'); app.textContent='';

  /* hero */
  const hero = el('section','' ); hero.id='hero';
  hero.innerHTML = '<div class="col"><p class="eyebrow">'+esc(t.eyebrow)+'</p><h1>'+t.title+'</h1><p class="lead">'+esc(t.lead)+'</p>'
    + '<div class="hero-meta">'+t.tags.map((x,i)=>'<span class="tagpill"><i style="--tc:var(--a'+(i%7+1)+')"></i>'+esc(x)+'</span>').join('')+'</div></div>';
  app.append(hero);

  /* toc */
  const toc = el('section'); toc.id='toc';
  toc.innerHTML = '<div class="col"><p class="eyebrow">'+esc(t.tocLabel)+'</p><ol>'
    + SECTIONS.map(s=>'<li><a href="#'+s.id+'"><span class="n" style="--tn:'+s.color+'">'+s.num+'</span><span class="t">'+esc(s[LANG].title)+'</span></a></li>').join('')
    + '</ol></div>';
  app.append(toc);

  /* sections */
  SECTIONS.forEach(s=>{
    const c = s[LANG];
    const sec = el('section','sec'); sec.id = s.id; sec.style.setProperty('--accent', s.color);

    const head = el('div','col');
    const hd = el('div','sec-head');
    hd.innerHTML = '<span class="sec-num">'+s.num+'</span><div style="flex:1"><h2>'+esc(c.title)+'</h2><p class="sec-dek">'+esc(c.dek)+'</p></div>';
    const sb = el('button','ctl share'); sb.type='button'; sb.textContent='§';
    sb.title = t.share; sb.setAttribute('aria-label', t.share + ': ' + c.title);
    sb.addEventListener('click', ()=>share(s.id));
    hd.append(sb);
    head.append(hd);
    const bodyWrap = el('div','rv');
    c.body.forEach(p=> bodyWrap.append(el('p','',p)));
    head.append(bodyWrap);
    sec.append(head);

    /* figure */
    const fig = FIGS[s.scene] ? FIGS[s.scene](c, LANG) : null;
    if(fig){
      if(SCROLL_SCENES[s.scene] && c.steps){
        const scene = el('div','scene');
        const sticky = el('div','scene-sticky');
        const figure = el('figure'); figure.style.margin='0';
        figure.append(fig.node);
        if(c.figCaption) figure.append(el('figcaption','',c.figCaption));
        sticky.append(figure);
        const steps = el('div','scene-steps');
        c.steps.forEach((st,i)=>{
          const d = el('div','step'); d.dataset.step = i;
          d.innerHTML = '<h4><span class="dot"></span>'+esc(st.h)+'</h4><p>'+esc(st.p)+'</p>';
          steps.append(d);
        });
        scene.append(sticky, steps);
        sec.append(scene);
        SCENES.push({sticky, fig, nodes:[...steps.querySelectorAll('.step')], io:null});
        steps.querySelector('.step').classList.add('on');
      } else {
        const col = el('div', WIDE[s.scene] ? 'rv' : 'col rv');
        const figure = el('figure');
        figure.append(fig.node);
        if(c.figCaption) figure.append(el('figcaption','',c.figCaption));
        col.append(figure);
        sec.append(col);
      }
    }

    /* callout + dives */
    const tail = el('div','col');
    if(c.callout){
      const co = el('div','callout rv');
      co.innerHTML = '<span class="lbl">'+esc(t.practice)+'</span><p>'+c.callout+'</p>';
      tail.append(co);
    }
    (c.dives||[]).forEach(d=>{
      const det = el('details','dive');
      det.innerHTML = '<summary>'+esc(t.diveLabel)+' · '+esc(d.t)+'</summary><div class="dive-body">'+d.html+'</div>';
      tail.append(det);
    });
    if(tail.childNodes.length) sec.append(tail);
    app.append(sec);
  });

  /* sources */
  const src = el('section','sec'); src.id='sources'; src.style.setProperty('--accent','var(--a4)');
  src.innerHTML = '<div class="col"><div class="sec-head"><span class="sec-num">†</span><div style="flex:1"><h2>'+esc(t.sourcesTitle)+'</h2></div></div>'
    + '<ol>'+SOURCES.map(s=>'<li><a href="'+s.u+'" target="_blank" rel="noopener">'+esc(s.t)+'</a></li>').join('')+'</ol></div>';
  app.append(src);

  const f = el('footer'); f.innerHTML = '<div class="col">'+esc(t.footer)+'</div>';
  app.append(f);

  /* reveal */
  if(!RM){
    const rio = new IntersectionObserver(entries=>{
      entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); rio.unobserve(e.target); } });
    }, {rootMargin:'0px 0px -8% 0px', threshold:0.05});
    document.querySelectorAll('.rv').forEach(n=>rio.observe(n));
    observers.push(rio);
  } else {
    document.querySelectorAll('.rv').forEach(n=>n.classList.add('in'));
  }
  requestAnimationFrame(wireScenes);

  /* anything already on screen shows immediately */
  requestAnimationFrame(()=>{
    document.querySelectorAll('.rv').forEach(n=>{
      const r = n.getBoundingClientRect();
      if(r.top < window.innerHeight) n.classList.add('in');
    });
  });
}

/* ---------- language switching, keeping your place ---------- */
function currentSectionId(){
  let best=null, bestD=Infinity;
  document.querySelectorAll('section[id]').forEach(s=>{
    const d = Math.abs(s.getBoundingClientRect().top - 90);
    if(d<bestD){ bestD=d; best=s.id; }
  });
  return best;
}
function setLang(l){
  if(l===LANG) return;
  const anchor = currentSectionId();
  const offset = anchor ? document.getElementById(anchor).getBoundingClientRect().top : 0;
  LANG = l;
  try{ localStorage.setItem('cw-lang', l); }catch(e){}
  const hash = location.hash;
  history.replaceState(null,'','?lang='+l+hash);
  render();
  if(anchor){
    const prev = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior='auto';
    const n = document.getElementById(anchor);
    if(n) window.scrollTo(0, window.scrollY + n.getBoundingClientRect().top - offset);
    document.documentElement.style.scrollBehavior = prev;
  }
}
$('#langEn').addEventListener('click', ()=>setLang('en'));
$('#langFr').addEventListener('click', ()=>setLang('fr'));

/* ---------- progress ---------- */
const pbar = $('#progress > i');
let ticking=false;
function onScroll(){
  if(ticking) return; ticking=true;
  requestAnimationFrame(()=>{
    const h = document.documentElement.scrollHeight - window.innerHeight;
    pbar.style.width = (h>0 ? Math.min(100, Math.max(0, window.scrollY/h*100)) : 0) + '%';
    ticking=false;
  });
}
window.addEventListener('scroll', onScroll, {passive:true});
let reflowT;
function onReflow(){ onScroll(); clearTimeout(reflowT); reflowT = setTimeout(wireScenes, 180); }
window.addEventListener('resize', onReflow);
window.addEventListener('orientationchange', onReflow);
if(stackedMQ.addEventListener) stackedMQ.addEventListener('change', onReflow);

/* ---------- boot ---------- */
render();
onScroll();
if(location.hash){
  const id = location.hash.slice(1);
  requestAnimationFrame(()=>{
    const n = document.getElementById(id);
    if(n){
      const prev = document.documentElement.style.scrollBehavior;
      document.documentElement.style.scrollBehavior='auto';
      n.scrollIntoView();
      document.documentElement.style.scrollBehavior=prev;
    }
  });
}
</script>
